<!-- FILE: scripts/JobDetail_Table_JS.html -->
<script>
  // =========================================================
  // JOB DETAIL REGISTER TABLE CONTROLLER
  // Pengelolaan filter data penugasan, pagination tabel utama, rendering kolom, dan ekspor data Job Detail
  // =========================================================

  var fpJobInstance = null;
  var currentJobPage = 1;
  var jobPageSize = 10;
  var filteredJobData = [];
  var rawJobData = [];
  var nextGlobalJobNumber = "";

  document.addEventListener("DOMContentLoaded", function () {
    initJobDateRangePicker();
    setupJobFilterListeners();
    loadJobDataFromSheet();
  });

  // =========================================================
  // LOAD JOB DATA FROM SHEET
  // Memuat kumpulan data register Mastercase dari backend Google Sheets
  // =========================================================
  function loadJobDataFromSheet(onSuccessCallback) {
    if (typeof google === "undefined" || !google.script || !google.script.run) return;

    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          rawJobData = response.data || [];
          if (response.nextJobNumber) nextGlobalJobNumber = response.nextJobNumber;
          applyJobFilters();

          if (typeof renderFinanceTable === "function") renderFinanceTable(rawJobData);
          if (typeof renderDashboard === "function") renderDashboard(rawJobData);
          if (typeof onSuccessCallback === "function") onSuccessCallback(rawJobData);
        } else {
          Swal.fire('Error', (response && response.error) || 'Gagal memuat data Mastercase', 'error');
        }
      })
      .withFailureHandler(function (err) {
        Swal.fire('Error', err.message || 'Terjadi kesalahan sistem', 'error');
      })
      .getMastercaseData();
  }

  // =========================================================
  // RENDER JOB TABLE
  // Merender baris data Mastercase pada tabel Job Detail sesuai status filter dan halaman aktif
  // =========================================================
  function renderJobTable(dataList) {
    var tbody = document.querySelector("#page-job-detail table tbody");
    if (!tbody) return;

    filteredJobData = dataList || [];
    var totalRecords = filteredJobData.length;

    calculateJobKPIs(dataList || []);

    if (totalRecords === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="py-8 text-center text-slate-400 font-medium">Belum ada data Mastercase yang sesuai.</td></tr>';
      renderPaginationControls(0);
      return;
    }

    var totalPages = Math.ceil(totalRecords / jobPageSize);
    if (currentJobPage > totalPages) currentJobPage = totalPages;
    if (currentJobPage < 1) currentJobPage = 1;

    var startIndex = (currentJobPage - 1) * jobPageSize;
    var endIndex = Math.min(startIndex + jobPageSize, totalRecords);
    var pageData = filteredJobData.slice(startIndex, endIndex);

    var html = '';
    pageData.forEach(function (item) {
      var jobNo = item["Job Number"] || "";
      var client = item["Client"] || "-";
      var instructionDate = item["Instruction Date"] || "-";
      var owner = item["Owner / Client's Customer"] || "-";
      var pic = item["Lead PIC"] || item["PIC"] || "-";
      var refMsi = item["Ref MSI"] || "-";
      var refClient = item["Ref Client"] || "-";
      var lob = item["LOB"] || "-";
      var surveyType = item["Type of Survey"] || "-";
      var driveUrl = item["Folder"] || "";

      var jobStatus = typeof getCalculatedJobStatus === 'function' ? getCalculatedJobStatus(item) : (item["Status"] || "On Process");
      var warningBadge = typeof getJobWarningBadge === 'function' ? getJobWarningBadge(item) : "";

      var statusBadgeClass = "bg-amber-100 text-amber-800 border-amber-200";
      if (jobStatus === "Report Sent" || jobStatus === "Invoice Sent") {
        statusBadgeClass = "bg-blue-100 text-blue-600 border-blue-200";
      } else if (jobStatus === "Invoice Paid") {
        statusBadgeClass = "bg-emerald-100 text-emerald-600 border-emerald-200";
      } else if (jobStatus === "Awaiting Invoice") {
        statusBadgeClass = "bg-purple-100 text-purple-600 border-purple-200";
      } else if (jobStatus === "In Site Survey") {
        statusBadgeClass = "bg-sky-100 text-sky-600 border-sky-200";
      } else if (jobStatus === "Drafting Report") {
        statusBadgeClass = "bg-indigo-100 text-indigo-600 border-indigo-200";
      } else if (jobStatus === "Cancelled") {
        statusBadgeClass = "bg-slate-100 text-slate-700 border-slate-200";
      }

      var pipelineHtml = typeof renderPipelineStepper === 'function' ? renderPipelineStepper(item) : "";

      var folderBtnHtml = '';
      if (driveUrl && driveUrl !== '-' && driveUrl.indexOf('http') !== -1) {
        folderBtnHtml = '<a href="' + driveUrl + '" target="_blank" rel="noopener noreferrer" ' +
          'class="p-2 rounded-lg text-amber-600 hover:text-amber-700 hover:bg-amber-50 transition inline-flex items-center gap-1 font-semibold text-xs" title="Buka Folder Google Drive">' +
          '<i class="fa-solid fa-folder-open text-base"></i>' +
          '</a>';
      } else {
        folderBtnHtml = '<span class="text-slate-300 text-xs" title="Folder belum tersedia">-</span>';
      }

      html += '<tr class="hover:bg-slate-50/80 transition group border-b border-slate-100">' +
        '<td class="py-3.5 px-3 text-center">' +
        '<button onclick="toggleRowExpand(\'' + jobNo + '\')" class="text-slate-400 hover:text-slate-700 p-1 transition" id="arrow_' + jobNo + '">' +
        '<i class="fa-solid fa-chevron-right text-xs"></i>' +
        '</button>' +
        '</td>' +

        '<td class="py-3.5 px-4 font-bold text-slate-900 bg-white group-hover:bg-slate-50 sticky left-0 z-10 shadow-[2px_0_5px_rgba(0,0,0,0.03)]">' +
        '<div class="flex flex-col items-start">' +
        '<span class="text-[#EC1F27] font-bold text-sm">#' + jobNo + '</span>' +
        warningBadge +
        '</div>' +
        '</td>' +

        '<td class="py-3.5 px-4">' +
        '<div class="font-bold text-slate-900 leading-tight">' + client + '</div>' +
        '<div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">' +
        '<i class="fa-regular fa-calendar text-[10px]"></i> ' + instructionDate + ' • ' + (owner !== '-' ? owner : 'N/A') +
        '</div>' +
        '</td>' +

        '<td class="py-3.5 px-4">' +
        '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 font-semibold text-[11px]">' + pic + '</span>' +
        '</td>' +

        '<td class="py-3.5 px-4">' +
        '<div class="font-mono text-slate-800 font-bold text-xs">' + refMsi + '</div>' +
        '<div class="text-[10px] text-slate-400 font-mono">Ref: ' + (refClient !== '-' ? refClient : 'N/A') + '</div>' +
        '</td>' +

        '<td class="py-3.5 px-4">' +
        '<div class="font-bold text-slate-800 text-xs">' + lob + '</div>' +
        '<span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-blue-50 text-blue-600 border border-blue-100 inline-block mt-0.5">' +
        (surveyType !== '-' ? surveyType : 'Damage Survey') +
        '</span>' +
        '</td>' +

        '<td class="py-3.5 px-4 text-center"><div class="flex items-center justify-center gap-1">' + pipelineHtml + '</div></td>' +

        '<td class="py-3.5 px-4 text-center">' +
        '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ' + statusBadgeClass + '">' + jobStatus + '</span>' +
        '</td>' +

        '<td class="py-3.5 px-3 text-center">' + folderBtnHtml + '</td>' +

        '<td class="py-3.5 px-4 text-center bg-white group-hover:bg-slate-50 sticky right-0 z-10 shadow-[-2px_0_5px_rgba(0,0,0,0.03)]">' +
        '<div class="flex items-center justify-center gap-1">' +
        '<button onclick="showJobDetail(\'' + jobNo + '\', ' + item._rowIndex + ')" class="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition" title="Lihat Detail"><i class="fa-regular fa-eye text-xs"></i></button>' +
        '<button onclick="editJobRecord(\'' + jobNo + '\', ' + item._rowIndex + ')" class="p-1.5 rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 transition" title="Edit Data"><i class="fa-solid fa-pen-to-square text-xs"></i></button>' +
        '<button onclick="deleteJobRecord(' + item._rowIndex + ', \'' + jobNo + '\')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="Hapus Job"><i class="fa-solid fa-trash-can text-xs"></i></button>' +
        '</div>' +
        '</td>' +
        '</tr>' +

        '<tr id="expand_' + jobNo + '" class="hidden bg-slate-50/60 border-b border-slate-200">' +
        '<td colspan="10" class="p-4">' + (typeof renderExpandAuditTrail === 'function' ? renderExpandAuditTrail(item) : '') + '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
    renderPaginationControls(totalRecords, startIndex + 1, endIndex);
  }

  // =========================================================
  // CALCULATE JOB KPIS
  // Menghitung ringkasan metrik statistik operasional (Total Active, Site Survey, Drafting, Invoicing, Completed)
  // =========================================================
  function calculateJobKPIs(data) {
    var countOnProcess = 0;
    var countSiteSurvey = 0;
    var countDraftingReport = 0;
    var countReportSent = 0;
    var countAwaitingInvoice = 0;
    var countInvoiceSent = 0;
    var countInvoicePaid = 0;
    var countCancelled = 0;

    (data || []).forEach(function (item) {
      var jobStatus = typeof getCalculatedJobStatus === 'function'
        ? getCalculatedJobStatus(item)
        : (item["Status"] || "On Process");

      switch (jobStatus) {
        case "On Process":
          countOnProcess++;
          break;
        case "In Site Survey":
          countSiteSurvey++;
          break;
        case "Drafting Report":
          countDraftingReport++;
          break;
        case "Report Sent":
          countReportSent++;
          break;
        case "Awaiting Invoice":
          countAwaitingInvoice++;
          break;
        case "Invoice Sent":
          countInvoiceSent++;
          break;
        case "Invoice Paid":
        case "Invoice Paid / Lunas":
          countInvoicePaid++;
          break;
        case "Cancelled":
        case "Case Cancelled":
          countCancelled++;
          break;
        default:
          countOnProcess++;
          break;
      }
    });

    // Render Angka ke UI HTML
    var setTxt = function (id, val) {
      var el = document.getElementById(id);
      if (el) el.innerText = val;
    };

    setTxt("kpiOnProcess", countOnProcess);
    setTxt("kpiSiteSurvey", countSiteSurvey);
    setTxt("kpiDraftingReport", countDraftingReport);
    setTxt("kpiReportSent", countReportSent);
    setTxt("kpiAwaitingInvoice", countAwaitingInvoice);
    setTxt("kpiInvoiceSent", countInvoiceSent);
    setTxt("kpiInvoicePaid", countInvoicePaid);
    setTxt("kpiCancelled", countCancelled);
  }

  // =========================================================
  // RENDER PAGINATION CONTROLS
  // Merender tombol prev/next dan nomor halaman tabel Job Detail
  // =========================================================
  function renderPaginationControls(totalRecords, startItem, endItem) {
    var infoSpan = document.getElementById("jobPaginationInfo");
    var controlsDiv = document.getElementById("jobPaginationControls");
    if (!infoSpan || !controlsDiv) return;

    if (totalRecords === 0) {
      infoSpan.innerHTML = "Menampilkan <strong>0</strong> Job";
      controlsDiv.innerHTML = "";
      return;
    }

    infoSpan.innerHTML = "Menampilkan <strong>" + startItem + " - " + endItem + "</strong> dari <strong>" + totalRecords + "</strong> Job";
    var totalPages = Math.ceil(totalRecords / jobPageSize);
    var html = '<button onclick="changeJobPage(' + (currentJobPage - 1) + ')" ' + (currentJobPage === 1 ? 'disabled class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition"') + '>Prev</button>';

    for (var i = 1; i <= totalPages; i++) {
      if (i === currentJobPage) {
        html += '<button class="px-3 py-1.5 rounded-lg bg-[#EC1F27] text-white font-bold shadow-sm">' + i + '</button>';
      } else {
        html += '<button onclick="changeJobPage(' + i + ')" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition">' + i + '</button>';
      }
    }

    html += '<button onclick="changeJobPage(' + (currentJobPage + 1) + ')" ' + (currentJobPage === totalPages ? 'disabled class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition"') + '>Next</button>';
    controlsDiv.innerHTML = html;
  }

  // =========================================================
  // CHANGE JOB PAGE
  // Berpindah ke nomor halaman tabel yang dipilih
  // =========================================================
  function changeJobPage(page) {
    var totalPages = Math.ceil(filteredJobData.length / jobPageSize);
    if (page < 1 || page > totalPages) return;
    currentJobPage = page;
    renderJobTable(filteredJobData);
  }

  // =========================================================
  // INIT JOB DATE RANGE PICKER
  // Inisialisasi library kalender Flatpickr untuk filter rentang tanggal penugasan
  // =========================================================
  function initJobDateRangePicker() {
    var dateInput = document.getElementById("dateRangePickerJob");
    var clearBtn = document.getElementById("clearJobDateBtn");
    if (!dateInput || typeof flatpickr === "undefined") return;

    fpJobInstance = flatpickr(dateInput, {
      mode: "range",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d M Y",
      locale: { rangeSeparator: " s/d " },
      onChange: function (selectedDates) {
        if (selectedDates.length > 0 && clearBtn) clearBtn.classList.remove("hidden");
        else if (clearBtn) clearBtn.classList.add("hidden");
        if (selectedDates.length === 2 || selectedDates.length === 0) applyJobFilters();
      }
    });
  }

  // =========================================================
  // CLEAR JOB DATE RANGE
  // Mengosongkan filter kalender rentang tanggal
  // =========================================================
  function clearJobDateRange() {
    if (fpJobInstance) fpJobInstance.clear();
    var clearBtn = document.getElementById("clearJobDateBtn");
    if (clearBtn) clearBtn.classList.add("hidden");
    applyJobFilters();
  }

  // =========================================================
  // RESET JOB FILTERS
  // Mengatur ulang seluruh input pencarian, dropdown LOB, PIC, dan Status ke kondisi awal
  // =========================================================
  function resetJobFilters() {
    if (document.getElementById('searchJobInput')) document.getElementById('searchJobInput').value = '';
    if (document.getElementById('filterLOB')) document.getElementById('filterLOB').value = '';
    if (document.getElementById('filterReportStatus')) document.getElementById('filterReportStatus').value = '';
    if (document.getElementById('filterPIC')) document.getElementById('filterPIC').value = '';

    clearJobDateRange();
    applyJobFilters();
  }

  // =========================================================
  // APPLY JOB FILTERS
  // Menyaring dataset Mastercase berdasarkan kata kunci pencarian, LOB, PIC, status, dan rentang tanggal
  // =========================================================
  function applyJobFilters() {
    var searchVal = (document.getElementById('searchJobInput')?.value || '').toLowerCase().trim();
    var lobVal = document.getElementById('filterLOB')?.value || '';
    var statusVal = document.getElementById('filterReportStatus')?.value || '';
    var picVal = document.getElementById('filterPIC')?.value || '';

    var selectedDates = fpJobInstance ? fpJobInstance.selectedDates : [];
    var startDate = selectedDates.length > 0 ? selectedDates[0] : null;
    var endDate = selectedDates.length > 1 ? selectedDates[1] : startDate;

    var filtered = (rawJobData || []).filter(function (item) {
      var jobNo = String(item["Job Number"] || "").toLowerCase();
      var client = String(item["Client"] || "").toLowerCase();
      var owner = String(item["Owner / Client's Customer"] || "").toLowerCase();
      var itemLob = String(item["LOB"] || "");
      var itemPic = String(item["Lead PIC"] || item["PIC"] || "");
      var itemStatus = typeof getCalculatedJobStatus === 'function' ? getCalculatedJobStatus(item) : (item["Status"] || "On Process");

      var matchSearch = !searchVal || jobNo.indexOf(searchVal) !== -1 || client.indexOf(searchVal) !== -1 || owner.indexOf(searchVal) !== -1;
      var matchLOB = !lobVal || itemLob.toLowerCase().indexOf(lobVal.toLowerCase()) !== -1;
      var matchPIC = !picVal || itemPic === picVal;
      var matchStatus = !statusVal || itemStatus.toLowerCase() === statusVal.toLowerCase();

      var matchDate = true;
      var instDateStr = item["Instruction Date"] || "-";
      if (startDate && instDateStr !== '-') {
        var rowDate = new Date(instDateStr);
        if (rowDate && !isNaN(rowDate.getTime())) {
          matchDate = endDate ? (rowDate >= startDate && rowDate <= new Date(endDate.getTime() + 86400000)) : (rowDate >= startDate);
        }
      }

      return matchSearch && matchLOB && matchPIC && matchStatus && matchDate;
    });

    currentJobPage = 1;
    renderJobTable(filtered);
  }

  // =========================================================
  // SETUP JOB FILTER LISTENERS
  // Memasang event listener otomatis pada input pencarian dan filter dropdown
  // =========================================================
  function setupJobFilterListeners() {
    document.getElementById('searchJobInput')?.addEventListener('input', applyJobFilters);
    document.getElementById('filterLOB')?.addEventListener('change', applyJobFilters);
    document.getElementById('filterReportStatus')?.addEventListener('change', applyJobFilters);
    document.getElementById('filterPIC')?.addEventListener('change', applyJobFilters);
  }

  // =========================================================
  // EXPORT JOB DETAIL TO EXCEL
  // Membuka modal ekspor data Job Detail yang sedang terfilter ke file Excel
  // =========================================================
  function exportJobDetailToExcel() {
    var filteredData = (typeof filteredJobData !== 'undefined') ? filteredJobData : [];
    if (typeof exportMastercaseUnified === 'function') {
      exportMastercaseUnified(filteredData, 'Job Detail');
    }
  }
</script>
