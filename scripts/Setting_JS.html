<script type="module">
// =========================================================
// SETTING USER PROFILE CONTROLLER
// Pengelolaan profil pengguna, update Firestore, Google Drive Avatar & kalkulasi statistik PIC
// =========================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getAuth, 
  updateProfile, 
  updatePassword,
  EmailAuthProvider,              
  reauthenticateWithCredential   
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  setDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDizKdf-nSFi3hXGirkJZIeF_RJt_OjfGM",
  authDomain: "msi-atlas-adjusting.firebaseapp.com",
  projectId: "msi-atlas-adjusting",
  storageBucket: "msi-atlas-adjusting.firebasestorage.app",
  messagingSenderId: "346794538444",
  appId: "1:346794538444:web:3d6aa5a1113da0c74e9969",
  measurementId: "G-D1H40EJV6L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// =========================================================
// CONVERT FILE TO BASE64
// Mengubah input file objek lokal menjadi string Base64 Data URL
// =========================================================
function convertFileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(file);
  });
}

// =========================================================
// PREVIEW SETTING AVATAR
// Menampilkan pratinjau gambar foto profil yang dipilih pengguna
// =========================================================
window.previewSettingAvatar = function (event) {
  const input = event.target;
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const preview = document.getElementById('setting_avatar_preview');
      if (preview) {
        preview.src = e.target.result;
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
};

// =========================================================
// LOAD USER SETTINGS
// Memuat data profil user aktif dari Firestore collection users ke dalam form
// =========================================================
window.loadUserSettings = async function () {
  const user = auth.currentUser;
  if (!user) return;

  const emailEl = document.getElementById('setting_email');
  if (emailEl) emailEl.value = user.email || '';

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    let profileData = window.currentUserProfile || {};
    if (userSnap.exists()) {
      profileData = userSnap.data();
      window.currentUserProfile = profileData;
    }

    if (typeof populatePicSelect === 'function' && typeof globalPicList !== 'undefined') {
      populatePicSelect("setting_picCode", globalPicList, "-- Pilih Kode PIC --");
    }

    const nameEl = document.getElementById('setting_fullname');
    const phoneEl = document.getElementById('setting_phone');
    const picCodeEl = document.getElementById('setting_picCode');
    const roleBadge = document.getElementById('setting_role_badge');
    const role = document.getElementById('setting_role');
    const avatarPreview = document.getElementById('setting_avatar_preview');

    const fullName = profileData.name || user.displayName || '';
    if (nameEl) nameEl.value = fullName;
    if (phoneEl) phoneEl.value = profileData.phone || '';
    if (picCodeEl) picCodeEl.value = profileData.picCode || '';
    if (role) role.value = profileData.role || '';

    if (roleBadge) {
      roleBadge.innerText = String(profileData.role || 'Adjuster').toUpperCase();
    }

    if (avatarPreview) {
      if (profileData.photoURL && String(profileData.photoURL).trim() !== "") {
        const cleanUrl = profileData.photoURL.split("?")[0];
        avatarPreview.src = cleanUrl + "?t=" + Date.now();
      } else if (user.photoURL) {
        const cleanUrl = user.photoURL.split("?")[0];
        avatarPreview.src = cleanUrl + "?t=" + Date.now();
      }
    }

    calculateUserProjectStats(profileData.picCode, fullName);

  } catch (err) {
    console.error("Gagal memuat profil Firestore di Settings:", err);
  }
};

// =========================================================
// CALCULATE USER PROJECT STATS
// Menghitung jumlah proyek aktif dan selesai berdasarkan PIC Code pengguna
// =========================================================
function calculateUserProjectStats(picCode, fullName) {
  const activeEl = document.getElementById('stat_project_active');
  const completedEl = document.getElementById('stat_project_completed');

  if (!activeEl || !completedEl) return;

  if (typeof rawJobData === 'undefined' || !rawJobData || rawJobData.length === 0) {
    activeEl.innerText = '0 Project';
    completedEl.innerText = '0 Project';
    return;
  }

  let targetCode = String(picCode || '').trim().toUpperCase();

  if (!targetCode && fullName && typeof globalPicList !== 'undefined') {
    const match = globalPicList.find(p => {
      const picNameClean = String(p.name || "").toLowerCase();
      const userFullNameClean = String(fullName).toLowerCase();
      return picNameClean.includes(userFullNameClean) || userFullNameClean.includes(picNameClean);
    });
    if (match) targetCode = String(match.code).toUpperCase();
  }

  if (!targetCode) {
    activeEl.innerText = '0 Project';
    completedEl.innerText = '0 Project';
    return;
  }

  let activeCount = 0;
  let completedCount = 0;

  rawJobData.forEach(item => {
    const itemPic = item["Lead PIC"] || item["PIC"] || "";
    const status = typeof getCalculatedJobStatus === 'function' ? getCalculatedJobStatus(item) : (item["Status"] || "On Process");

    if (String(itemPic).trim().toUpperCase() === targetCode) {
      if (status === 'Invoice Paid' || status === 'Completed') {
        completedCount++;
      } else if (status !== 'Cancelled') {
        activeCount++;
      }
    }
  });

  activeEl.innerText = activeCount + ' Project';
  completedEl.innerText = completedCount + ' Project';
}

// =========================================================
// HANDLE SAVE SETTINGS
// Menyimpan pembaruan profil pengguna ke Firestore, Auth, Drive, dan Google Sheets PIC
// =========================================================
window.handleSaveSettings = async function (e) {
  if (e && e.preventDefault) e.preventDefault();
  const user = auth.currentUser;
  if (!user) return;

  const newName = document.getElementById('setting_fullname')?.value.trim();
  const newPhone = document.getElementById('setting_phone')?.value.trim();
  const newPicCode = document.getElementById('setting_picCode')?.value.trim();
  const newPassword = document.getElementById('setting_newPassword')?.value;
  const photoInput = document.getElementById('setting_avatar_input');

  if (!newName || !newPhone) {
    Swal.fire('Form Belum Lengkap', 'Nama Lengkap dan Nomor HP wajib diisi!', 'warning');
    return;
  }

  Swal.fire({
    title: 'Menyimpan Perubahan...',
    text: 'Mengunggah data & memperbarui profil...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  let photoUploadWarning = null;

  try {
    let finalPhotoURL = window.currentUserProfile?.photoURL || user.photoURL || "";

    if (photoInput && photoInput.files && photoInput.files[0]) {
      const file = photoInput.files[0];
      try {
        const base64Data = await convertFileToBase64(file);
        const fileName = `PROFILE_${user.uid}_${Date.now()}.${file.name.split('.').pop()}`;

        const uploadRes = await new Promise((resolve) => {
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            resolve({ success: false, error: "Layanan google.script.run tidak tersedia di lingkungan ini." });
            return;
          }

          google.script.run
            .withSuccessHandler((res) => {
              resolve(res || { success: false, error: "Respons kosong dari skrip backend." });
            })
            .withFailureHandler((err) => {
              const errMsg = err && err.message ? err.message : String(err);
              console.warn("DriveApp execution warning captured:", errMsg);
              resolve({ success: false, error: errMsg });
            })
            .uploadProfilePhotoToDrive(base64Data, fileName);
        });

        if (uploadRes && uploadRes.success && uploadRes.url) {
          const cleanUrl = uploadRes.url.split("?")[0];
          finalPhotoURL = `${cleanUrl}?t=${Date.now()}`;
        } else {
          console.warn("Gagal mengunggah foto profil ke Drive:", uploadRes?.error);
          photoUploadWarning = uploadRes?.error || "Gagal mengunggah foto ke Google Drive.";
        }
      } catch (fileErr) {
        console.error("Kesalahan membaca file foto:", fileErr);
        photoUploadWarning = fileErr.message || "Gagal memproses file foto.";
      }
    }

    if (finalPhotoURL && !finalPhotoURL.includes("?t=")) {
      const cleanUrl = finalPhotoURL.split("?")[0];
      finalPhotoURL = `${cleanUrl}?t=${Date.now()}`;
    }

    const userRef = doc(db, "users", user.uid);
    const updateData = {
      name: newName,
      phone: newPhone,
      picCode: newPicCode,
      photoURL: finalPhotoURL,
      updatedAt: serverTimestamp()
    };

    await setDoc(userRef, updateData, { merge: true });
    await updateProfile(user, { displayName: newName, photoURL: finalPhotoURL });

    if (newPassword && newPassword.length >= 6) {
      await updatePassword(user, newPassword);
    }

    window.currentUserProfile = { ...window.currentUserProfile, ...updateData };
    if (typeof window.updateHeaderProfileUI === 'function') {
      window.updateHeaderProfileUI();
    }

    const avatarPreview = document.getElementById('setting_avatar_preview');
    if (avatarPreview && finalPhotoURL) {
      avatarPreview.src = finalPhotoURL;
    }

    if (typeof google !== 'undefined' && google.script && google.script.run && newPicCode) {
      setTimeout(() => {
        try {
          google.script.run
            .withSuccessHandler((res) => console.log("Sync PIC Sheet Berhasil:", res))
            .withFailureHandler((err) => console.warn("Sync PIC Sheet Terabaikan:", err))
            .syncUserPicToSpreadsheet({ name: newName, picCode: newPicCode, email: user.email });
        } catch (e) {
          console.warn("Sync execution bypassed:", e);
        }
      }, 100);
    }

    const pwdEl = document.getElementById('setting_newPassword');
    if (pwdEl) pwdEl.value = '';
    if (photoInput) photoInput.value = '';

    calculateUserProjectStats(newPicCode, newName);

    if (photoUploadWarning) {
      Swal.fire({
        icon: 'warning',
        title: 'Profil Tersimpan (Foto Terkendala)',
        text: `Data profil berhasil diperbarui, namun unggah foto terkendala: ${photoUploadWarning}`,
        confirmButtonText: 'OK'
      });
    } else {
      Swal.fire({
        icon: 'success',
        title: 'Profil Berhasil Diperbarui!',
        timer: 1800,
        showConfirmButton: false
      });
    }

  } catch (err) {
    console.error("Gagal menyimpan setting detail:", err);
    Swal.fire('Gagal Menyimpan', err.message || 'Terjadi kesalahan sistem', 'error');
  }
};
</script>
