<!-- FILE: scripts/Notification_JS.html -->
<script>
// =========================================================
// NOTIFICATION CLIENT CONTROLLER
// Pengelolaan dropdown notifikasi header, status unread, dan view pusat notifikasi
// =========================================================

var currentFullNotifFilter = 'all';

// =========================================================
// GET CURRENT USER EMAIL
// Mengambil email pengguna aktif dari state Firebase Auth
// =========================================================
function getCurrentUserEmail() {
  var currentUser = window.currentUserProfile || {};
  var authUser = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
  return currentUser.email || (authUser ? authUser.email : "");
}

// =========================================================
// TOGGLE NOTIFICATION DROPDOWN
// Menampilkan atau menyembunyikan popover panel notifikasi pada header
// =========================================================
function toggleNotificationDropdown() {
  var menu = document.getElementById("notifDropdownMenu");
  if (!menu) return;

  if (menu.classList.contains("hidden")) {
    menu.classList.remove("hidden");
    loadNotificationsFromSheet();
  } else {
    menu.classList.add("hidden");
  }
}

document.addEventListener("click", function (event) {
  var container = document.getElementById("notificationDropdownContainer");
  var menu = document.getElementById("notifDropdownMenu");
  if (container && menu && !container.contains(event.target)) {
    menu.classList.add("hidden");
  }
});

// =========================================================
// LOAD NOTIFICATIONS FROM SHEET
// Mengambil data notifikasi realtime dari backend Apps Script
// =========================================================
function loadNotificationsFromSheet() {
  if (typeof google === "undefined" || !google.script || !google.script.run) return;

  var userEmail = getCurrentUserEmail();

  if (!userEmail) {
    setTimeout(function() {
      loadNotificationsFromSheet();
    }, 500);
    return;
  }

  google.script.run
    .withSuccessHandler(function (response) {
      if (response && response.success) {
        renderNotificationDropdown(response.data || [], response.unreadCount || 0);
      } else {
        showNotificationError((response && response.error) || "Gagal mengambil data notifikasi.");
      }
    })
    .withFailureHandler(function (err) {
      showNotificationError(err.message || "Terjadi kesalahan sistem Apps Script.");
    })
    .getNotificationsData(userEmail);
}

// =========================================================
// SHOW NOTIFICATION ERROR
// Menampilkan pesan gagal saat loading data notifikasi
// =========================================================
function showNotificationError(msg) {
  var listContainer = document.getElementById("notifListContainer");
  if (listContainer) {
    listContainer.innerHTML = '<div class="p-5 text-center text-rose-500 text-xs font-semibold flex flex-col items-center justify-center gap-1.5">' +
      '<i class="fa-solid fa-triangle-exclamation text-base"></i>' +
      '<span>' + msg + '</span>' +
      '</div>';
  }
}

// =========================================================
// RENDER NOTIFICATION DROPDOWN
// Merender list item notifikasi dan badge hitung pada header
// =========================================================
function renderNotificationDropdown(list, unreadCount) {
  var badgeDot = document.getElementById("notifBadgeDot");
  var unreadBadge = document.getElementById("notifUnreadBadge");
  var listContainer = document.getElementById("notifListContainer");

  window.globalNotificationsData = list || [];

  if (badgeDot) {
    if (unreadCount > 0) {
      badgeDot.innerText = unreadCount > 99 ? '99+' : unreadCount;
      badgeDot.classList.remove("hidden");
    } else {
      badgeDot.classList.add("hidden");
    }
  }

  if (unreadBadge) {
    unreadBadge.innerText = unreadCount + " Baru";
  }

  if (!listContainer) return;

  if (!list || list.length === 0) {
    listContainer.innerHTML = '<div class="p-6 text-center text-slate-400 text-xs font-medium">' +
      '<i class="fa-regular fa-bell-slash text-2xl mb-1 text-slate-300 block"></i>' +
      'Tidak ada notifikasi saat ini.' +
      '</div>';
    return;
  }

  var recentList = list.slice(0, 10);
  var html = '';

  recentList.forEach(function (item) {
    var isUnread = item.status === "Unread";
    var bgClass = isUnread ? "bg-red-50/40 hover:bg-red-50/70" : "bg-white hover:bg-slate-50";
    var iconFont = "fa-circle-info";
    var containerStyle = "text-blue-500 bg-blue-50";

    if (item.type === "Overdue") {
      iconFont = "fa-triangle-exclamation";
      containerStyle = "text-[#EC1F27] bg-red-50";
    } else if (item.type === "Warning") {
      iconFont = "fa-clock";
      containerStyle = "text-amber-600 bg-amber-50";
    }

    html += '<div onclick="handleNotificationClick(\'' + item.notifId + '\', \'' + item.jobNo + '\')" ' +
      'class="p-3.5 flex items-start gap-3 cursor-pointer transition border-b border-slate-50 ' + bgClass + '">' +
      '<div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ' + containerStyle + '">' +
      '<i class="fa-solid ' + iconFont + ' text-xs"></i>' +
      '</div>' +
      '<div class="flex-1 min-w-0">' +
      '<div class="flex items-center justify-between gap-1">' +
      '<h4 class="text-xs font-bold text-slate-800 truncate">' + item.title + '</h4>' +
      '<span class="text-[9px] text-slate-400 shrink-0">' + String(item.createdAt).split(' ')[0] + '</span>' +
      '</div>' +
      '<p class="text-[11px] text-slate-500 mt-0.5 leading-snug line-clamp-2">' + item.message + '</p>' +
      '</div>' +
      (isUnread ? '<span class="w-2 h-2 rounded-full bg-[#EC1F27] shrink-0 mt-1.5"></span>' : '') +
      '</div>';
  });

  html += '<div class="p-2.5 bg-slate-50 text-center border-t border-slate-100 sticky bottom-0 z-10">' +
    '<button type="button" onclick="goToFullNotificationsPage()" class="text-xs text-[#EC1F27] font-bold hover:underline inline-flex items-center gap-1.5">' +
    'Lihat Semua Notifikasi (' + list.length + ') <i class="fa-solid fa-arrow-right text-[10px]"></i>' +
    '</button>' +
    '</div>';

  listContainer.innerHTML = html;
}

// =========================================================
// HANDLE NOTIFICATION CLICK
// Menandai notifikasi telah dibaca dan menavigasikan ke baris detail job yang bersangkutan
// =========================================================
function handleNotificationClick(notifId, jobNo) {
  var userEmail = getCurrentUserEmail();

  var menu = document.getElementById("notifDropdownMenu");
  if (menu) menu.classList.add("hidden");

  if (typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          loadNotificationsFromSheet();
          if (typeof renderFullNotificationsUI === 'function') {
            renderFullNotificationsUI();
          }
        }
      })
      .markNotificationAsRead(notifId, userEmail);
  }

  if (typeof switchPage === 'function') {
    switchPage('job-detail');
  }

  setTimeout(function() {
    if (typeof toggleJobMilestoneDetails === "function" && jobNo) {
      toggleJobMilestoneDetails(null, jobNo);
    }
  }, 300);
}

// =========================================================
// GO TO FULL NOTIFICATIONS PAGE
// Mengarahkan tampilan ke tab halaman pusat notifikasi
// =========================================================
function goToFullNotificationsPage() {
  var menu = document.getElementById("notifDropdownMenu");
  if (menu) menu.classList.add("hidden");

  if (typeof switchPage === 'function') {
    switchPage('fullNotification');
  }

  if (typeof renderFullNotificationsUI === 'function') {
    renderFullNotificationsUI();
  }
}

// =========================================================
// MARK ALL NOTIFICATIONS AS READ
// Menandai semua pesan notifikasi sebagai terbaca di backend dan memperbarui UI
// =========================================================
function markAllNotificationsAsRead() {
  var userEmail = getCurrentUserEmail();

  if (typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function() {
        loadNotificationsFromSheet();
        if (typeof renderFullNotificationsUI === 'function') {
          renderFullNotificationsUI();
        }
      })
      .markAllNotificationsAsRead(userEmail);
  }
}

// =========================================================
// FILTER FULL NOTIFICATIONS
// Mengubah filter kategori tampilan pada halaman Pusat Notifikasi
// =========================================================
function filterFullNotif(filterType) {
  currentFullNotifFilter = filterType || 'all';

  var btnAll = document.getElementById('btnFilterAll');
  var btnUnread = document.getElementById('btnFilterUnread');
  var btnOverdue = document.getElementById('btnFilterOverdue');

  var activeClass = "px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-xs font-bold transition";
  var inactiveClass = "px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition font-semibold";

  if (btnAll) btnAll.className = (filterType === 'all') ? activeClass : inactiveClass;
  if (btnUnread) btnUnread.className = (filterType === 'unread') ? activeClass : inactiveClass;
  if (btnOverdue) btnOverdue.className = (filterType === 'overdue') ? activeClass : inactiveClass;

  renderFullNotificationsUI();
}

// =========================================================
// RENDER FULL NOTIFICATIONS UI
// Merender daftar lengkap notifikasi pada tab Full Notifications
// =========================================================
function renderFullNotificationsUI() {
  var container = document.getElementById("fullNotifContainer");
  if (!container) return;

  var list = window.globalNotificationsData || [];
  var searchVal = (document.getElementById("searchFullNotifInput")?.value || "").toLowerCase().trim();

  var filtered = list.filter(function(item) {
    var matchFilter = true;
    if (currentFullNotifFilter === 'unread') matchFilter = item.status === 'Unread';
    else if (currentFullNotifFilter === 'overdue') matchFilter = item.type === 'Overdue';

    var matchSearch = !searchVal || 
      item.title.toLowerCase().indexOf(searchVal) !== -1 || 
      item.message.toLowerCase().indexOf(searchVal) !== -1 || 
      String(item.jobNo).toLowerCase().indexOf(searchVal) !== -1;

    return matchFilter && matchSearch;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="p-12 text-center text-slate-400 text-xs font-medium">' +
      '<i class="fa-regular fa-bell-slash text-3xl text-slate-300 block mb-2"></i>' +
      'Tidak ada notifikasi yang sesuai dengan filter.' +
      '</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(item) {
    var isUnread = item.status === 'Unread';
    var bgStyle = isUnread ? 'bg-red-50/30 font-medium' : 'bg-white';
    var iconBg = 'bg-blue-100 text-blue-600';
    var iconClass = 'fa-circle-info';

    if (item.type === 'Overdue') {
      iconBg = 'bg-rose-100 text-rose-600';
      iconClass = 'fa-triangle-exclamation';
    } else if (item.type === 'Warning') {
      iconBg = 'bg-amber-100 text-amber-600';
      iconClass = 'fa-clock';
    }

    html += '<div onclick="handleNotificationClick(\'' + item.notifId + '\', \'' + item.jobNo + '\')" class="p-4 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between gap-4 ' + bgStyle + '">' +
      '<div class="flex items-start gap-3.5">' +
        '<div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ' + iconBg + '">' +
          '<i class="fa-solid ' + iconClass + ' text-sm"></i>' +
        '</div>' +
        '<div>' +
          '<div class="flex items-center gap-2">' +
            '<span class="text-xs text-slate-900 font-bold">' + item.title + '</span>' +
            '<span class="px-2 py-0.5 bg-slate-100 text-slate-600 font-mono text-[10px] rounded-md">Job #' + item.jobNo + '</span>' +
          '</div>' +
          '<div class="text-[11px] text-slate-500 mt-0.5 leading-relaxed">' + item.message + '</div>' +
          '<div class="text-[10px] text-slate-400 mt-1.5 flex items-center gap-2">' +
            '<span><i class="fa-regular fa-clock mr-1"></i>' + item.createdAt + '</span>' +
            '<span>•</span>' +
            '<span>PIC: ' + item.recipientPic + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="flex items-center gap-2 shrink-0">' +
        (isUnread ? '<span class="px-2.5 py-0.5 bg-[#EC1F27] text-white text-[10px] font-bold rounded-full">Baru</span>' : '') +
        '<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}
</script>
