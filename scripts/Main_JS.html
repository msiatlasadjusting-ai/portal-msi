<!-- FILE: scripts/Main_JS.html -->
<script>
// =========================================================
// MAIN GLOBAL CONTROLLER & SPA ROUTER
// Pengaturan navigasi SPA, sidebar toggle, sinkronisasi UI profil, dan ekspor data Mastercase
// =========================================================

var PAGE_HEADER_CONFIG = {
  'overview': {
    title: 'Overview Dashboard',
    subtitle: 'Selamat Datang di Sistem Mahardhika Surveyor Indonesia (MSI)'
  },
  'dashboard': {
    title: 'Overview Dashboard',
    subtitle: 'Selamat Datang di Sistem Mahardhika Surveyor Indonesia (MSI)'
  },
  'job-detail': {
    title: 'Job Detail Register',
    subtitle: 'Kelola instruksi penugasan survei dan laporan klaim Loss Adjusting'
  },
  'finance': {
    title: 'Financial Register',
    subtitle: 'Monitoring penagihan invoice, fee adjuster, dan status pembayaran'
  },
  'setting': {
    title: 'System Setting',
    subtitle: 'Kelola profil akun, inisial PIC, dan keamanan akses portal MSI.'
  },
  'fullNotification': {
    title: 'Notification Center',
    subtitle: 'Pantau informasi, pembaruan, dan aktivitas terbaru terkait portal MSI.'
  }
};

var previousPage = 'job-detail';

document.addEventListener("DOMContentLoaded", function () {
  initSidebarToggle();
  updateHeaderProfileUI();
  if (typeof loadNotificationsFromSheet === 'function') {
    loadNotificationsFromSheet();
  }
});

// =========================================================
// INIT SIDEBAR TOGGLE
// Mengatur fungsionalitas expand dan collapse sidebar navigasi
// =========================================================
function initSidebarToggle() {
  var sidebar = document.getElementById('sidebar');
  var toggleBtn = document.getElementById('toggle-btn');
  var logoFull = document.getElementById('logo-full');
  var logoIcon = document.getElementById('logo-icon');
  var sidebarTexts = document.querySelectorAll('.sidebar-text');

  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', function () {
      sidebar.classList.toggle('w-64');
      sidebar.classList.toggle('w-20');

      sidebarTexts.forEach(function (text) {
        text.classList.toggle('hidden');
      });

      if (logoFull) logoFull.classList.toggle('hidden');
      if (logoIcon) logoIcon.classList.toggle('hidden');

      toggleBtn.style.transform = sidebar.classList.contains('w-20')
        ? 'rotate(180deg)'
        : 'rotate(0deg)';
    });
  }
}

// =========================================================
// UPDATE HEADER PROFILE UI
// Menyelaraskan nama, role, dan foto profil pengguna pada header global
// =========================================================
function updateHeaderProfileUI() {
  var profile = window.currentUserProfile;
  if (!profile) return;

  var nameEl = document.getElementById('globalHeaderUserProfileName');
  var roleEl = document.getElementById('globalHeaderUserProfileRole');
  var imgEl = document.getElementById('globalHeaderUserProfileImage');

  if (nameEl && profile.name) {
    nameEl.innerText = profile.name;
  }

  if (roleEl && profile.role) {
    roleEl.innerText = profile.role;
  }

  if (imgEl && profile.photoURL && String(profile.photoURL).trim() !== "") {
    var tempImg = new Image();
    tempImg.onload = function() {
      imgEl.src = profile.photoURL;
      imgEl.classList.remove('p-1');
    };
    tempImg.src = profile.photoURL;
  }
}

window.updateHeaderProfileUI = updateHeaderProfileUI;

// =========================================================
// SWITCH PAGE
// Mengatur peralihan tab halaman SPA dan pemuatan data terkait
// =========================================================
function switchPage(pageName) {
  if (!pageName) return;

  var activePageEl = document.querySelector('.page-content:not(.hidden)');
  if (activePageEl && (pageName === 'Mastercase_Create' || pageName === 'Mastercase_Edit' || pageName === 'Mastercase_Detail')) {
    var currentId = activePageEl.id.replace('page-', '');
    if (currentId !== 'Mastercase_Create' && currentId !== 'Mastercase_Edit' && currentId !== 'Mastercase_Detail') {
      previousPage = currentId;
    }
  }

  var globalHeader = document.querySelector('header');
  var hiddenHeaderPages = ['Mastercase_Create', 'Mastercase_Edit', 'Mastercase_Detail', 'Profile_SetUp'];

  if (globalHeader) {
    if (hiddenHeaderPages.includes(pageName)) {
      globalHeader.classList.add('hidden');
    } else {
      globalHeader.classList.remove('hidden');
    }
  }

  var headerConfig = PAGE_HEADER_CONFIG[pageName] || {
    title: 'MSI Atlas System',
    subtitle: 'Sistem Informasi Management Loss Adjusting'
  };

  var titleEl = document.getElementById('globalPageTitle');
  var subtitleEl = document.getElementById('globalPageSubtitle');

  if (titleEl) titleEl.innerText = headerConfig.title;
  if (subtitleEl) subtitleEl.innerText = headerConfig.subtitle;

  updateHeaderProfileUI();

  document.querySelectorAll('.page-content').forEach(function (el) {
    el.classList.add('hidden');
  });

  var targetPage = document.getElementById('page-' + pageName);
  if (targetPage) {
    targetPage.classList.remove('hidden');
  }

  var baseInactiveClass = "nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#383E4C] hover:text-white text-slate-400 transition group relative";
  var activeClass = "nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-[#EC1F27] text-white font-semibold shadow-md shadow-red-900/20 transition group relative";

  document.querySelectorAll('.nav-item').forEach(function (btn) {
    if (btn.id === 'nav-job-detail') {
      btn.className = baseInactiveClass.replace('gap-3', 'justify-between');
    } else {
      btn.className = baseInactiveClass;
    }
  });

  var activeNav = document.getElementById('nav-' + pageName);
  if (activeNav) {
    if (pageName === 'job-detail') {
      activeNav.className = activeClass.replace('gap-3', 'justify-between');
    } else {
      activeNav.className = activeClass;
    }
  }

  if (pageName === 'overview' || pageName === 'dashboard') {
    if (typeof renderDashboard === 'function' && typeof rawJobData !== 'undefined') {
      setTimeout(function () { renderDashboard(rawJobData); }, 100);
    } else if (typeof renderChartsNow === 'function') {
      setTimeout(renderChartsNow, 100);
    }
  } else if (pageName === 'job-detail') {
    if (typeof renderJobTable === 'function' && typeof rawJobData !== 'undefined') {
      renderJobTable(rawJobData);
    }
  } else if (pageName === 'finance') {
    if (typeof renderFinanceTable === 'function' && typeof rawJobData !== 'undefined') {
      renderFinanceTable(rawJobData);
    }
  } else if (pageName === 'Mastercase_Create') {
    if (typeof prepareCreateForm === 'function') {
      prepareCreateForm();
    }
  } else if (pageName === 'setting') {
    if (typeof loadUserSettings === 'function') {
      setTimeout(loadUserSettings, 100);
    }
  }

  if (typeof lucide !== 'undefined') {
    setTimeout(function () { lucide.createIcons(); }, 50);
  }
}

// =========================================================
// GO BACK
// Mengembalikan tampilan ke halaman aktif sebelumnya
// =========================================================
function goBack() {
  switchPage(previousPage || 'job-detail');
}

// =========================================================
// EXPORT MASTERCASE UNIFIED
// Membuka dialog pilihan ekspor data Mastercase lengkap ke berkas Excel
// =========================================================
function exportMastercaseUnified(filteredData, sourcePage) {
  var dataToExport = (filteredData && filteredData.length > 0) 
    ? filteredData 
    : (typeof rawJobData !== 'undefined' ? rawJobData : []);

  if (!dataToExport || dataToExport.length === 0) {
    Swal.fire('Data Kosong', 'Tidak ada data Mastercase yang dapat diexport.', 'warning');
    return;
  }

  var totalAll = typeof rawJobData !== 'undefined' ? rawJobData.length : 0;
  var totalFiltered = dataToExport.length;

  Swal.fire({
    title: 'Export Data Mastercase',
    html: '<p class="text-xs text-slate-600">Ekspor data lengkap (Teknis Operasional + Keuangan) ke format Excel.</p>',
    icon: 'question',
    showCancelButton: true,
    showDenyButton: true,
    confirmButtonText: '<i class="fa-solid fa-filter"></i> Export Hasil Filter (' + totalFiltered + ' Data)',
    denyButtonText: '<i class="fa-solid fa-database"></i> Export Semua Data (' + totalAll + ' Data)',
    cancelButtonText: 'Batal',
    confirmButtonColor: '#059669',
    denyButtonColor: '#2563EB',
    customClass: {
      popup: 'rounded-2xl',
      confirmButton: 'text-xs px-4 py-2.5 rounded-xl font-bold',
      denyButton: 'text-xs px-4 py-2.5 rounded-xl font-bold',
      cancelButton: 'text-xs px-4 py-2.5 rounded-xl'
    }
  }).then((result) => {
    if (result.isConfirmed) {
      processExecuteMastercaseExport(dataToExport, "Mastercase_Filtered_" + sourcePage.replace(/\s+/g, '_'));
    } else if (result.isDenied) {
      processExecuteMastercaseExport(rawJobData, "Mastercase_Full_All");
    }
  });
}

// =========================================================
// PROCESS EXECUTE MASTERCASE EXPORT
// Mengonversi dataset Mastercase ke lembar kerja Excel dengan styling & border otomatis
// =========================================================
function processExecuteMastercaseExport(dataset, fileNamePrefix) {
  var excelRows = dataset.map(function(item, index) {
    return {
      "No": index + 1,
      "Job Number": item["Job Number"] || "-",
      "Instruction Date": item["Instruction Date"] || "-",
      "Lead PIC": item["Lead PIC"] || item["PIC"] || "-",
      "Ref MSI": item["Ref MSI"] || "-",
      "Ref Client": item["Ref Client"] || "-",
      "Type of Survey": item["Type of Survey"] || "-",
      "LOB": item["LOB"] || "-",
      "Client": item["Client"] || "-",
      "Broker / Agent": item["Broker / Agent"] || "-",
      "Owner / Client's Customer": item["Owner / Client's Customer"] || "-",
      "Location": item["Location"] || "-",
      "Object / Vessel / Unit": item["Object / Vessel / Unit"] || "-",
      "Accident": item["Accident"] || "-",
      "DOL": item["DOL"] || "-",
      "Survey Date": item["Survey Date"] || "-",
      "Survey Start Date": item["Survey Start Date"] || item["surveyStartDate"] || "-",
      "Survey Finish Date": item["Survey Finish Date"] || item["surveyFinishDate"] || "-",
      "Survey PIC Handler": item["Survey PIC Handler"] || item["stage2PicHandler"] || item["Lead PIC"] || item["PIC"] || "-",
      "Survey Remarks": item["Survey Remarks"] || item["Remarks"] || "-",
      "Report Start Date": item["Report Start Date"] || item["reportPreparationStartDate"] || "-",
      "Report Sent Date": item["Report Sent Date"] || item["Survey Report Sent on"] || "-",
      "Report PIC Handler": item["Report PIC Handler"] || item["stage3PicHandler"] || item["Lead PIC"] || item["PIC"] || "-",
      "Report Remarks": item["Report Remarks"] || item["stage3Remarks"] || "-",
      "Location Client": item["Location Client"] || "-",
      "LOP Start Date": item["LOP Start Date"] || item["lopStartDate"] || "-",
      "LOP Approved Date": item["LOP Approved Date"] || item["lopApprovedDate"] || "-",
      "LOP PIC Handler": item["LOP PIC Handler"] || item["stage4PicHandler"] || item["Lead PIC"] || item["PIC"] || "-",
      "LOP Remarks": item["LOP Remarks"] || item["stage4Remarks"] || "-",
      "PIC Client": item["PIC Client"] || "-",
      "Invoice Date": item["Invoice Date"] || item["Invoice date"] || "-",
      "Paid Date": item["Paid Date"] || item["Paid on"] || "-",
      "Invoice PIC Handler": item["Invoice PIC Handler"] || item["stage5PicHandler"] || "-",
      "Invoice Remarks": item["Invoice Remarks"] || item["stage5Remarks"] || "-",
      "Remarks FAT": item["Remarks FAT"] || "-",
      
      "Fee (IDR)": formatRupiahExcel(item["Fee (IDR)"]),
      "TAX Basis (IDR)": formatRupiahExcel(item["TAX Basis (IDR)"]),
      "IOU (IDR)": formatRupiahExcel(item["IOU (IDR)"]),
      "Expenses Act. (IDR)": formatRupiahExcel(item["Expenses Act. (IDR)"]),
      "Admin Cost (IDR)": formatRupiahExcel(item["Admin Cost (IDR)"]),
      "Expenses": formatRupiahExcel(item["Expenses"]),
      "VAT 11% (IDR)": formatRupiahExcel(item["VAT 11% (IDR)"]),
      "Invoice Amount (IDR)": formatRupiahExcel(item["Invoice Amount (IDR)"]),
      "Comm.": item["Comm."] || "-",
      "Load": formatRupiahExcel(item["Load"]),
      "Nomor Jurnal Load": item["Nomor Jurnal Load"] || "-",
      "No. Faktur Pajak": item["No. Faktur Pajak"] || "-",
      "PPH 23 (IDR)": formatRupiahExcel(item["PPH 23 (IDR)"]),
      "Nomor Bukti Potong PPh 23": item["Nomor Bukti Potong PPh 23"] || "-",
      "Tanggal Bukti Potong PPh 23": item["Tanggal Bukti Potong PPh 23"] || "-",
      "Invoice Payment (net PPH23)": formatRupiahExcel(item["Invoice Payment (net PPH23)"]),
      "Client Payment": formatRupiahExcel(item["Client Payment"]),
      "Selisih": formatRupiahExcel(item["Selisih"]),
      "Reimburse Settled (+/-)": formatRupiahExcel(item["Reimburse Settled (+/-)"]),
      "Status": typeof getCalculatedJobStatus === 'function' ? getCalculatedJobStatus(item) : (item["Status"] || "On Process"),
      "Folder": item["Folder"] || "-"
    };
  });

  var worksheet = XLSX.utils.json_to_sheet(excelRows);
  var workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Mastercase Register");

  var range = XLSX.utils.decode_range(worksheet['!ref']);
  
  for (var R = range.s.r; R <= range.e.r; ++R) {
    for (var C = range.s.c; C <= range.e.c; ++C) {
      var cell_address = XLSX.utils.encode_cell({ r: R, c: C });
      if (!worksheet[cell_address]) continue;

      if (R === 0) {
        worksheet[cell_address].s = {
          fill: { fgColor: { rgb: "1E232A" } },
          font: { name: "Arial", sz: 10, bold: true, color: { rgb: "FFFFFF" } },
          alignment: { horizontal: "center", vertical: "center", wrapText: true },
          border: {
            top: { style: "thin", color: { rgb: "000000" } },
            bottom: { style: "medium", color: { rgb: "000000" } },
            left: { style: "thin", color: { rgb: "D1D5DB" } },
            right: { style: "thin", color: { rgb: "D1D5DB" } }
          }
        };
      } else {
        worksheet[cell_address].s = {
          font: { name: "Arial", sz: 9 },
          alignment: { vertical: "center" },
          border: {
            top: { style: "thin", color: { rgb: "E5E7EB" } },
            bottom: { style: "thin", color: { rgb: "E5E7EB" } },
            left: { style: "thin", color: { rgb: "E5E7EB" } },
            right: { style: "thin", color: { rgb: "E5E7EB" } }
          }
        };
      }
    }
  }

  worksheet['!rows'] = [{ hpt: 28 }];
  
  var headers = Object.keys(excelRows[0] || {});
  var colWidths = headers.map(function(header) {
    var maxLen = header.length;
    excelRows.forEach(function(row) {
      var valStr = String(row[header] || '');
      if (valStr.length > maxLen) maxLen = valStr.length;
    });
    return { wch: Math.min(Math.max(maxLen + 4, 14), 42) };
  });
  
  worksheet['!cols'] = colWidths;

  var todayStr = new Date().toISOString().split('T')[0];
  XLSX.writeFile(workbook, fileNamePrefix + "_" + todayStr + ".xlsx");
}
</script>
