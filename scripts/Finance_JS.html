<!-- FILE: scripts/Finance_JS.html -->
<script>
  // =========================================================
  // FINANCE & BILLING CONTROLLER
  // Pengelolaan filter tanggal penagihan, kalkulasi KPI keuangan, tabel Financial Register, dan ekspor data
  // =========================================================

  var fpFinanceInstance = null;
  var currentFinancePage = 1;
  var financePageSize = 10;
  var filteredFinanceData = [];

  document.addEventListener("DOMContentLoaded", function () {
    initFinanceDateRangePicker();
    setupFinanceFilterListeners();
  });

  // =========================================================
  // INIT FINANCE DATE RANGE PICKER
  // Inisialisasi library Flatpickr untuk filter rentang tanggal keuangan
  // =========================================================
  function initFinanceDateRangePicker() {
    var dateInput = document.getElementById("dateRangePicker");
    var clearBtn = document.getElementById("clearDateBtn");

    if (!dateInput || typeof flatpickr === "undefined") return;

    fpFinanceInstance = flatpickr(dateInput, {
      mode: "range",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d M Y",
      locale: { rangeSeparator: " s/d " },
      onChange: function (selectedDates) {
        if (selectedDates.length > 0) {
          if (clearBtn) clearBtn.classList.remove("hidden");
        } else {
          if (clearBtn) clearBtn.classList.add("hidden");
        }
        if (selectedDates.length === 2 || selectedDates.length === 0) {
          applyFinanceFilters();
        }
      }
    });
  }

  // =========================================================
  // CLEAR DATE RANGE
  // Mengosongkan filter rentang tanggal keuangan
  // =========================================================
  function clearDateRange() {
    if (fpFinanceInstance) fpFinanceInstance.clear();
    var clearBtn = document.getElementById("clearDateBtn");
    if (clearBtn) clearBtn.classList.add("hidden");
    applyFinanceFilters();
  }

  // =========================================================
  // RESET FINANCE FILTERS
  // Mengatur ulang input pencarian, filter status pembayaran, dan filter PIC keuangan ke kondisi awal
  // =========================================================
  function resetFinanceFilters() {
    var searchInput = document.getElementById('searchFinanceInput');
    var filterStatus = document.getElementById('filterPaymentStatus');
    var filterPIC = document.getElementById('filterPICFinance');

    if (searchInput) searchInput.value = '';
    if (filterStatus) filterStatus.value = '';
    if (filterPIC) filterPIC.value = '';

    clearDateRange();
    applyFinanceFilters();
  }

  // =========================================================
  // CALCULATE FINANCE KPIS
  // Menghitung metrik total tagihan gross, dana diterima, piutang outstanding, expenses riil, dan posisi net reimburse
  // =========================================================
  function calculateFinanceKPIs(data) {
    var totalGrossBilling = 0;
    var totalCashReceived = 0;
    var totalOutstanding = 0;
    var totalActualExpenses = 0;
    var totalReimburseNet = 0;

    var paidCasesCount = 0;
    var unpaidCasesCount = 0;

    (data || []).forEach(function (item) {
      var parseMoney = typeof parseMoneyValue === 'function' ? parseMoneyValue : function (v) { return Number(v) || 0; };

      var invAmount = parseMoney(item["Invoice Amount (IDR)"] || 0);
      var netPayment = parseMoney(item["Invoice Payment (net PPH23)"] || 0);
      var clientPayment = parseMoney(item["Client Payment"] || 0);

      var iouVal = parseMoney(item["IOU (IDR)"] || 0);
      var actExpVal = parseMoney(item["Expenses Act. (IDR)"] || 0);

      var paidOn = item["Paid Date"] || item["Paid on"] || "";
      var rawStatus = String(item["Status"] || "").trim();

      if (rawStatus === "Cancelled") return;

      totalGrossBilling += invAmount;
      totalCashReceived += clientPayment;
      totalActualExpenses += actExpVal;

      var reimburseNetJob = iouVal - actExpVal;
      totalReimburseNet += reimburseNetJob;

      var isPaid = (paidOn && paidOn !== '-' && paidOn !== '') || (clientPayment >= (netPayment > 0 ? netPayment : invAmount) && netPayment > 0);

      if (isPaid) {
        paidCasesCount++;
      } else {
        unpaidCasesCount++;
        var expectedTagihan = netPayment > 0 ? netPayment : invAmount;
        var sisaKurang = expectedTagihan - clientPayment;
        if (sisaKurang > 0) {
          totalOutstanding += sisaKurang;
        }
      }
    });

    var formatFn = function (v) { return formatRupiah(v); };

    var elemGross = document.getElementById("financeKpiTotalInvoice");
    var elemSettled = document.getElementById("financeKpiSettled");
    var elemPaidSub = document.getElementById("financeKpiPaidCountSub");

    var elemOutstanding = document.getElementById("financeKpiOutstanding");
    var elemUnpaidSub = document.getElementById("financeKpiUnpaidCountSub");

    var elemActExp = document.getElementById("financeKpiActualExpenses");
    var elemReimburse = document.getElementById("financeKpiReimburse");
    var elemIouSub = document.getElementById("financeKpiIouSubtext");

    if (elemGross) elemGross.innerText = formatFn(totalGrossBilling);
    if (elemSettled) elemSettled.innerText = formatFn(totalCashReceived);
    if (elemPaidSub) elemPaidSub.innerText = paidCasesCount + " Case Lunas";

    if (elemOutstanding) elemOutstanding.innerText = formatFn(totalOutstanding);
    if (elemUnpaidSub) elemUnpaidSub.innerText = unpaidCasesCount + " Case Belum Lunas";

    if (elemActExp) elemActExp.innerText = formatFn(totalActualExpenses);

    if (elemReimburse) {
      if (totalReimburseNet > 0) {
        elemReimburse.innerText = "+" + formatFn(totalReimburseNet);
        elemReimburse.className = "text-lg font-bold text-amber-600 mt-1";
        if (elemIouSub) elemIouSub.innerText = "Perusahaan Perlu Reimburse";
      } else if (totalReimburseNet < 0) {
        elemReimburse.innerText = formatFn(totalReimburseNet);
        elemReimburse.className = "text-lg font-bold text-amber-600 mt-1";
        if (elemIouSub) elemIouSub.innerText = "Surveyor Refund ke Perusahaan";
      } else {
        elemReimburse.innerText = formatFn(0);
        elemReimburse.className = "text-lg font-bold text-emerald-600 mt-1";
        if (elemIouSub) elemIouSub.innerText = "Settlement Impas / Clear";
      }
    }
  }

  // =========================================================
  // RENDER FINANCE TABLE
  // Merender tabel Financial Register lengkap dengan status pembayaran dan Expected Net Payment
  // =========================================================
  function renderFinanceTable(dataList) {
    var tbody = document.querySelector("#page-finance table tbody");
    if (!tbody) return;

    filteredFinanceData = dataList || [];
    var totalRecords = filteredFinanceData.length;

    calculateFinanceKPIs(dataList || []);

    if (totalRecords === 0) {
      tbody.innerHTML = '<tr><td colspan="17" class="py-8 text-center text-slate-400 font-medium">Belum ada data Keuangan yang sesuai.</td></tr>';
      renderFinancePaginationControls(0);
      return;
    }

    var totalPages = Math.ceil(totalRecords / financePageSize);
    if (currentFinancePage > totalPages) currentFinancePage = totalPages;
    if (currentFinancePage < 1) currentFinancePage = 1;

    var startIndex = (currentFinancePage - 1) * financePageSize;
    var endIndex = Math.min(startIndex + financePageSize, totalRecords);
    var pageData = filteredFinanceData.slice(startIndex, endIndex);

    var html = '';
    pageData.forEach(function (item) {
      var jobNo = item["Job Number"] || "";
      var refMsi = item["Ref MSI"] || "-";
      var pic = item["Lead PIC"] || item["PIC"] || "-";

      var jobStatus = (typeof getCalculatedJobStatus === 'function')
        ? getCalculatedJobStatus(item)
        : String(item["Status"] || "On Process").trim();

      var fee = item["Fee (IDR)"] || 0;
      var iou = item["IOU (IDR)"] || 0;
      var expAct = item["Expenses Act. (IDR)"] || 0;
      var expenses = item["Expenses"] || 0;
      var invDate = item["Invoice Date"] || item["Invoice date"] || "-";
      var netPayment = item["Invoice Payment (net PPH23)"] || 0;
      var paidOn = item["Paid Date"] || item["Paid on"] || "-";
      var clientPayment = item["Client Payment"] || 0;
      var selisih = item["Selisih"] || 0;
      var reimburseSettled = item["Reimburse Settled (+/-)"] || 0;
      var remarks = item["Remarks"] || "-";
      var remarksFat = item["Remarks FAT"] || "-";

      var numNetPayment = parseMoneyValue(netPayment);
      var numClientPayment = parseMoneyValue(clientPayment);
      var numSelisih = parseMoneyValue(selisih);
      var numReimburse = parseMoneyValue(reimburseSettled);

      var statusBadgeClass = "bg-amber-100 text-amber-800 border-amber-200";
      if (jobStatus === "Report Sent" || jobStatus === "Invoice Sent") {
        statusBadgeClass = "bg-blue-100 text-blue-600 border-blue-200";
      } else if (jobStatus === "Invoice Paid") {
        statusBadgeClass = "bg-emerald-100 text-emerald-600 border-emerald-200";
      } else if (jobStatus === "Awaiting Invoice") {
        statusBadgeClass = "bg-purple-100 text-purple-600 border-purple-200";
      } else if (jobStatus === "In Site Survey") {
        statusBadgeClass = "bg-sky-100 text-sky-600 border-sky-200";
      } else if (jobStatus === "Drafting Report") {
        statusBadgeClass = "bg-indigo-100 text-indigo-600 border-indigo-200";
      } else if (jobStatus === "Cancelled") {
        statusBadgeClass = "bg-slate-100 text-slate-700 border-slate-200";
      }
      var statusBadge = '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ' + statusBadgeClass + '">' + jobStatus + '</span>';

      var clientPaymentClass = "font-bold text-slate-800";
      if (numClientPayment >= numNetPayment && numNetPayment > 0) {
        clientPaymentClass = "font-bold text-emerald-600";
      } else if (numClientPayment > 0 && numClientPayment < numNetPayment) {
        clientPaymentClass = "font-bold text-amber-600";
      }

      var selisihClass = numSelisih === 0 ? "text-slate-600" : (numSelisih > 0 ? "text-emerald-600 font-bold" : "text-rose-600 font-bold");
      var reimburseClass = numReimburse === 0 ? "text-slate-600" : (numReimburse > 0 ? "text-blue-600 font-bold" : "text-amber-600 font-bold");

      html += '<tr class="hover:bg-slate-50/80 transition group border-b border-slate-100">' +
        '<td class="py-3.5 px-4 font-bold text-slate-900 bg-white group-hover:bg-slate-50 sticky left-0 z-10 shadow-[2px_0_5px_rgba(0,0,0,0.03)]">' +
        '<span class="text-[#EC1F27] font-bold text-sm">#' + jobNo + '</span>' +
        '</td>' +
        '<td class="py-3.5 px-4 text-slate-700 font-medium">' + refMsi + '</td>' +
        '<td class="py-3.5 px-4">' +
        '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 font-semibold text-[11px]">' + pic + '</span>' +
        '</td>' +
        '<td class="py-3.5 px-4 text-center">' + statusBadge + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono font-bold text-slate-900">' + formatRupiah(fee, false) + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono text-slate-500">' + formatRupiah(iou, false) + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono text-slate-700">' + formatRupiah(expAct, false) + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono font-bold text-slate-900">' + formatRupiah(expenses, false) + '</td>' +
        '<td class="py-3.5 px-4 text-slate-700 font-medium">' + (invDate !== '-' ? invDate : '-') + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono font-bold text-blue-700">' + formatRupiah(netPayment, false) + '</td>' +
        '<td class="py-3.5 px-4 text-slate-700 font-medium">' + (paidOn !== '-' ? paidOn : '-') + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono ' + clientPaymentClass + '">' + formatRupiah(clientPayment, false) + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono ' + selisihClass + '">' + formatRupiah(selisih, false) + '</td>' +
        '<td class="py-3.5 px-4 text-right font-mono ' + reimburseClass + '">' + (numReimburse > 0 ? '+' : '') + formatRupiah(reimburseSettled, false) + '</td>' +
        '<td class="py-3.5 px-4 max-w-xs truncate text-slate-600 text-xs" title="' + String(remarks).replace(/<[^>]*>?/gm, '') + '">' + remarks + '</td>' +
        '<td class="py-3.5 px-4 max-w-xs truncate text-slate-600 text-xs" title="' + String(remarksFat).replace(/<[^>]*>?/gm, '') + '">' + remarksFat + '</td>' +
        '<td class="py-3.5 px-4 text-center bg-white group-hover:bg-slate-50 sticky right-0 z-10 shadow-[-2px_0_5px_rgba(0,0,0,0.03)]">' +
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button onclick="showJobDetail(\'' + jobNo + '\', ' + item._rowIndex + ')" class="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition" title="Lihat Detail">' +
        '<i class="fa-regular fa-eye text-xs"></i>' +
        '</button>' +
        '<button onclick="editJobRecord(\'' + jobNo + '\', ' + item._rowIndex + ')" class="p-1.5 rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 transition" title="Edit Data">' +
        '<i class="fa-solid fa-pen-to-square text-xs"></i>' +
        '</button>' +
        '<button onclick="deleteJobRecord(' + item._rowIndex + ', \'' + jobNo + '\')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="Hapus Data">' +
        '<i class="fa-solid fa-trash-can text-xs"></i>' +
        '</button>' +
        '</div>' +
        '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
    renderFinancePaginationControls(totalRecords, startIndex + 1, endIndex);
  }

  // =========================================================
  // RENDER FINANCE PAGINATION CONTROLS
  // Merender tombol paginasi tabel data Keuangan
  // =========================================================
  function renderFinancePaginationControls(totalRecords, startItem, endItem) {
    var countSpan = document.getElementById("financeCountSpan");
    var controlsDiv = document.getElementById("financePaginationControls");

    if (!countSpan || !controlsDiv) return;

    if (totalRecords === 0) {
      countSpan.innerHTML = 'Menampilkan <strong>0</strong> Data Keuangan';
      controlsDiv.innerHTML = "";
      return;
    }

    countSpan.innerHTML = 'Menampilkan <strong>' + startItem + ' - ' + endItem + '</strong> dari <strong>' + totalRecords + '</strong> Data Keuangan';

    var totalPages = Math.ceil(totalRecords / financePageSize);
    var html = '';

    html += '<button onclick="changeFinancePage(' + (currentFinancePage - 1) + ')" ' + (currentFinancePage === 1 ? 'disabled class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition"') + '>Prev</button>';

    for (var i = 1; i <= totalPages; i++) {
      if (i === currentFinancePage) {
        html += '<button class="px-3 py-1.5 rounded-lg bg-[#EC1F27] text-white font-bold shadow-sm">' + i + '</button>';
      } else {
        html += '<button onclick="changeFinancePage(' + i + ')" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition">' + i + '</button>';
      }
    }

    html += '<button onclick="changeFinancePage(' + (currentFinancePage + 1) + ')" ' + (currentFinancePage === totalPages ? 'disabled class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition"') + '>Next</button>';

    controlsDiv.innerHTML = html;
  }

  // =========================================================
  // CHANGE FINANCE PAGE
  // Berpindah nomor halaman tabel Keuangan
  // =========================================================
  function changeFinancePage(page) {
    var totalPages = Math.ceil(filteredFinanceData.length / financePageSize);
    if (page < 1 || page > totalPages) return;
    currentFinancePage = page;
    renderFinanceTable(filteredFinanceData);
  }

  // =========================================================
  // APPLY FINANCE FILTERS
  // Menyaring dataset register keuangan berdasarkan nomor job, klien, nomor faktur, PIC, Ref MSI, dan tanggal invoice/paid
  // =========================================================
  function applyFinanceFilters() {
    var searchVal = (document.getElementById('searchFinanceInput')?.value || '').toLowerCase();
    var statusVal = document.getElementById('filterPaymentStatus')?.value || '';
    var picVal = document.getElementById('filterPICFinance')?.value || '';

    var selectedDates = fpFinanceInstance ? fpFinanceInstance.selectedDates : [];
    var startDate = selectedDates.length > 0 ? selectedDates[0] : null;
    var endDate = selectedDates.length > 1 ? selectedDates[1] : startDate;

    var filtered = (rawJobData || []).filter(function (item) {
      var jobNo = String(item["Job Number"] || "").toLowerCase();
      var client = String(item["Client"] || "").toLowerCase();
      var noFaktur = String(item["No. Faktur Pajak"] || "").toLowerCase();
      var itemPic = String(item["Lead PIC"] || item["PIC"] || "");
      var refMsiStr = item["Ref MSI"] || "-";
      var invDateStr = item["Invoice Date"] || item["Invoice date"] || "-";
      var paidDateStr = item["Paid Date"] || item["Paid on"] || "-";

      var itemStatus = (typeof getCalculatedJobStatus === 'function')
        ? getCalculatedJobStatus(item)
        : String(item["Status"] || "On Process").trim();

      var matchSearch = !searchVal ||
        jobNo.indexOf(searchVal) !== -1 ||
        client.indexOf(searchVal) !== -1 ||
        noFaktur.indexOf(searchVal) !== -1 ||
        refMsiStr.toLowerCase().indexOf(searchVal) !== -1;

      var matchPIC = !picVal || itemPic === picVal;
      var matchStatus = !statusVal || itemStatus.toLowerCase() === statusVal.toLowerCase();

      var matchDate = true;
      if (startDate) {
        var checkDates = [invDateStr, paidDateStr, refMsiStr];
        var foundValidDate = false;
        for (var d = 0; d < checkDates.length; d++) {
          var dateStr = checkDates[d];
          if (dateStr && dateStr !== '-') {
            var rowDate = new Date(dateStr);
            if (!isNaN(rowDate.getTime())) {
              if (endDate) {
                if (rowDate >= startDate && rowDate <= new Date(endDate.getTime() + 86400000)) {
                  foundValidDate = true;
                  break;
                }
              } else if (rowDate >= startDate) {
                foundValidDate = true;
                break;
              }
            }
          }
        }
        matchDate = foundValidDate;
      }

      return matchSearch && matchPIC && matchStatus && matchDate;
    });

    currentFinancePage = 1;
    renderFinanceTable(filtered);
  }

  // =========================================================
  // SETUP FINANCE FILTER LISTENERS
  // Memasang event listener otomatis pada input filter halaman Keuangan
  // =========================================================
  function setupFinanceFilterListeners() {
    document.getElementById('searchFinanceInput')?.addEventListener('input', applyFinanceFilters);
    document.getElementById('filterPaymentStatus')?.addEventListener('change', applyFinanceFilters);
    document.getElementById('filterPICFinance')?.addEventListener('change', applyFinanceFilters);
  }

  // =========================================================
  // EXPORT FINANCE TO EXCEL
  // Membuka modal ekspor data Keuangan terfilter ke lembar kerja Excel
  // =========================================================
  function exportFinanceToExcel() {
    var filteredData = (typeof filteredFinanceData !== 'undefined') ? filteredFinanceData : [];
    if (typeof exportMastercaseUnified === 'function') {
      exportMastercaseUnified(filteredData, 'Finance');
    }
  }
</script>
