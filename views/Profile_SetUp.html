<div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
  
  <div class="flex flex-col items-center text-center mb-6">
    <h2 class="text-xl font-bold text-slate-800">Lengkapi Profil Akun</h2>
    <p class="text-xs text-slate-500 mt-1 max-w-xs">Silakan isi data diri kamu sebelum menggunakan aplikasi.</p>

    <!-- AVATAR UPLOAD CIRCLE -->
    <div class="relative mt-6 group">
      <div class="w-24 h-24 rounded-full bg-slate-100 border-2 border-slate-200 shadow-inner overflow-hidden flex items-center justify-center">
        <img 
          id="setup_photoPreview" 
          src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" 
          alt="Avatar Preview" 
          class="w-full h-full object-contain p-5 opacity-60 transition-all duration-200"
        >
      </div>

      <label 
        for="setup_photoFile" 
        class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-gradient-to-tr from-[#EC1F27] to-[#F16531] text-white flex items-center justify-center shadow-md cursor-pointer hover:scale-105 active:scale-95 transition"
        title="Ubah Foto Profil"
      >
        <i class="fa-solid fa-pen text-xs"></i>
      </label>

      <input 
        type="file" 
        id="setup_photoFile" 
        accept="image/png, image/jpeg, image/jpg" 
        class="hidden" 
        onchange="previewProfileImage(event)"
      >
    </div>
    <span class="text-[10px] text-slate-400 mt-2 font-medium">Klik ikon pensil untuk memilih foto</span>
  </div>

  <!-- FORM DATA PROFIL -->
  <form onsubmit="handleSetupProfileSubmit(event)" class="space-y-4">
    
    <!-- Input Email (Readonly) -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
      <div class="relative">
        <input type="email" id="setup_email" readonly class="w-full pl-9 pr-3 py-2 text-xs bg-slate-100 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed">
        <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      </div>
    </div>

    <!-- Input Nama Lengkap -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap <span class="text-rose-500">*</span></label>
      <div class="relative">
        <input type="text" id="setup_name" required placeholder="Masukkan Nama Lengkap" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#F16531] focus:bg-white transition">
        <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      </div>
    </div>

    <!-- Input Nomor Telepon -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Telepon <span class="text-rose-500">*</span></label>
      <div class="relative">
        <input type="tel" id="setup_phone" required placeholder="Contoh: 08123456789" class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#F16531] focus:bg-white transition">
        <i class="fa-solid fa-phone text-[11px] absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
    </div>

    <!-- Role (Readonly) -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Role Akun</label>
      <div class="relative">
        <input type="text" value="Adjuster" readonly class="w-full pl-9 pr-3 py-2 text-xs bg-slate-100 border border-slate-200 rounded-xl text-slate-600 font-semibold cursor-not-allowed">
        <i class="fa-solid fa-user-shield text-[11px] absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
      <p class="text-[10px] text-slate-400 mt-1">Role default kamu adalah <strong>Adjuster</strong>. Hubungi Admin jika ingin mengubah role.</p>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full mt-5 bg-gradient-to-r from-[#EC1F27] to-[#F16531] text-white text-xs font-semibold py-3 rounded-xl transition shadow-md shadow-red-900/10 hover:opacity-95 active:scale-[0.99]">
      Simpan Profil & Lanjutkan
    </button>
  </form>
</div>

<!-- SCRIPT HELPER PREVIEW IMAGES -->
<script>
  function previewProfileImage(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('setup_photoPreview');
        if (preview) {
          preview.src = e.target.result;
          
          // Lepas padding agar foto user tampil FULL Lingkaran
          preview.classList.remove('p-5', 'object-contain', 'opacity-60');
          preview.classList.add('object-cover');
        }
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
