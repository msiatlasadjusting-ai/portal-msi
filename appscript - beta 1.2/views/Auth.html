<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Inter agar typography pas dengan desain -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>MSI Login</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f8f9fc]">

    <div class="relative min-h-screen w-full flex flex-col justify-between items-center p-4 overflow-hidden">

        <div
            class="absolute -top-32 -left-32 w-[500px] h-[500px] bg-orange-100/70 rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none">
        </div>
        <div
            class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-sky-100/70 rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none">
        </div>
        <div
            class="absolute top-1/3 -right-20 w-[500px] h-[500px] bg-rose-100/70 rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none">
        </div>

        <div></div>

        <!-- Card Login -->
        <div
            class="relative z-10 w-full max-w-[440px] bg-white rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-8 sm:p-10 my-auto">

            <!-- Logo & Header -->
            <div class="flex flex-col items-center text-center">
                <img src="https://lh3.googleusercontent.com/d/1Y97qWfMinIbl8FLEiZpKrEaxxa6JdjVd" alt="MSI Logo"
                    class="h-12 mb-4 object-contain">
                <h1 class="text-2xl sm:text-[28px] font-bold text-gray-900 tracking-tight">
                    Welcome to <span
                        class="bg-gradient-to-r from-[#EC1F27] to-[#F16531] bg-clip-text text-transparent">MSI</span>
                </h1>
                <p class="text-sm text-slate-500 mt-2 leading-relaxed px-2">
                    Access the Loss Adjusting & Claims Management System
                </p>
            </div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="mt-4 space-y-4">

                <!-- Field Email -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 mb-1.5">Email</label>
                    <input type="email" id="email" required placeholder="Enter your Email"
                        class="w-full px-4 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-[#F16531] transition text-gray-800 placeholder-slate-400">
                </div>

                <!-- Field Password -->
                <div>
                    <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="Enter Password"
                            class="w-full pl-4 pr-11 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-[#F16531] transition text-gray-800 placeholder-slate-400">

                        <!-- Tombol Show/Hide Password -->
                        <button type="button" id="togglePassword"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition p-1">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center cursor-pointer select-none">
                        <input type="checkbox"
                            class="w-4 h-4 rounded border-slate-300 text-[#F16531] focus:ring-[#F16531]">
                        <span class="ml-2 text-xs font-medium text-slate-600">Remember me</span>
                    </label>
                    <a href="#" class="text-xs font-semibold text-[#EC1F27] hover:underline">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3.5 px-4 bg-gradient-to-r from-[#EC1F27] to-[#F16531] hover:opacity-95 text-white font-semibold text-sm rounded-xl shadow-[0_8px_20px_rgba(236,31,39,0.25)] transition duration-200">
                        Sign in
                    </button>
                </div>

                <!-- <div class="text-center pt-2">
                  <p class="text-xs text-slate-500">
                      Don't have an account? <a href="#" class="font-semibold text-[#EC1F27] hover:underline">Sign up</a>
                  </p>
              </div> -->

            </form>
        </div>

        <!-- Footer Copyright -->
        <footer class="relative z-10 pt-3 text-center">
            <p class="text-xs text-slate-400">© 2026 PT Atlas Adjusting Indonesia. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
