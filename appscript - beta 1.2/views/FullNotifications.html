<!-- FILE: views/FullNotifications.html -->
<div class="space-y-6 font-inter">

  <!-- TAB FILTER & PENCARIAN -->
  <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-xs">

    <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button onclick="filterFullNotif('all')" id="btnFilterAll" class="px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-xs font-bold transition">Semua</button>
        <button onclick="filterFullNotif('unread')" id="btnFilterUnread" class="px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition">Belum Dibaca</button>
        <button onclick="filterFullNotif('overdue')" id="btnFilterOverdue" class="px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition">Overdue SLA</button>
      </div>

      <div class="relative w-full sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input type="text" id="searchFullNotifInput" oninput="renderFullNotificationsUI()" placeholder="Cari Job # atau judul..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
      </div>
    </div>

    <div class="relative">
      <button onclick="markAllNotificationsAsRead()" class="px-3.5 py-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5 transition">
        <i class="fa-solid fa-check-double text-emerald-600"></i> Tandai Semua Dibaca
      </button>
    </div>
  </div>

  <!-- LIST DAFTAR NOTIFIKASI -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden divide-y divide-slate-100" id="fullNotifContainer">
    <!-- Render via scripts/Notification_JS.html -->
  </div>

</div>
