<script type="module">
// =========================================================
// AUTHENTICATION CLIENT CONTROLLER
// Pengelolaan Firebase Authentication, session persistence, login, logout, setup profil dan reset password
// =========================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserSessionPersistence,
  signInWithEmailAndPassword,
  signOut,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDizKdf-nSFi3hXGirkJZIeF_RJt_OjfGM",
  authDomain: "msi-atlas-adjusting.firebaseapp.com",
  projectId: "msi-atlas-adjusting",
  storageBucket: "msi-atlas-adjusting.firebasestorage.app",
  messagingSenderId: "346794538444",
  appId: "1:346794538444:web:3d6aa5a1113da0c74e9969",
  measurementId: "G-D1H40EJV6L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserSessionPersistence).catch((error) => {
  console.error("Gagal mengeset session persistence:", error);
});

window.currentUserProfile = null;

// =========================================================
// SHOW SECTION
// Menampilkan seksi antarmuka yang dipilih dan menyembunyikan yang lain
// =========================================================
function showSection(targetId) {
  const sections = ['login-section', 'setup-profile-section', 'app-section'];
  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (id === targetId) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }
  });
}

// =========================================================
// TOGGLE PASSWORD VISIBILITY
// Listener interaktif untuk menampilkan atau menyembunyikan teks kata sandi
// =========================================================
document.addEventListener("DOMContentLoaded", () => {
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.innerHTML = isPassword ?
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a9.954 9.954 0 012.122-.063c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />` :
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
    });
  }
});

// =========================================================
// HANDLE LOGIN SUBMIT
// Memproses autentikasi login pengguna menggunakan email dan kata sandi
// =========================================================
window.handleLoginSubmit = function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  Swal.fire({ title: 'Memverifikasi...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      Swal.fire({ icon: 'success', title: 'Login Berhasil!', timer: 1000, showConfirmButton: false });
    })
    .catch((error) => {
      console.error(error);
      Swal.fire('Login Gagal', 'Email atau Password salah!', 'error');
    });
};

// =========================================================
// LOGOUT APP
// Membersihkan state pengguna, mereset header UI dan sign out dari Firebase
// =========================================================
window.logoutApp = function () {
  window.currentUserProfile = null;

  var nameEl = document.getElementById('globalHeaderUserProfileName');
  var roleEl = document.getElementById('globalHeaderUserProfileRole');
  var imgEl = document.getElementById('globalHeaderUserProfileImage');

  if (nameEl) nameEl.innerText = "User";
  if (roleEl) roleEl.innerText = "Adjuster";
  if (imgEl) imgEl.src = "https://cdn-icons-png.flaticon.com/512/1077/1077114.png";

  signOut(auth).then(function() {
    showSection('login-section');
  }).catch(function(err) {
    console.error("Gagal logout:", err);
    showSection('login-section');
  });
};

// =========================================================
// CONVERT FILE TO BASE64
// Helper konversi file gambar ke format Base64 Data URL
// =========================================================
function convertFileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(file);
  });
}

// =========================================================
// HANDLE SETUP PROFILE SUBMIT
// Inisialisasi profil pengguna awal saat login pertama kali
// =========================================================
window.handleSetupProfileSubmit = async function (e) {
  e.preventDefault();
  const user = auth.currentUser;
  if (!user) return;

  const name = document.getElementById('setup_name')?.value || user.displayName || '';
  const phone = document.getElementById('setup_phone')?.value || '';
  const photoInput = document.getElementById('setup_photoFile');
  const picCode = document.getElementById('setup_picCode')?.value || '';
  
  if (typeof google !== 'undefined' && google.script && google.script.run && picCode) {
    google.script.run.syncUserPicToSpreadsheet({ name: name, picCode: picCode, email: user.email });
  }

  if (!name || !phone) {
    Swal.fire('Form Belum Lengkap', 'Nama Lengkap dan Nomor Telepon wajib diisi!', 'warning');
    return;
  }

  Swal.fire({ title: 'Memproses Profil...', text: 'Mengunggah foto & menyimpan data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  try {
    let finalPhotoURL = user.photoURL || "";

    if (photoInput && photoInput.files && photoInput.files[0]) {
      const file = photoInput.files[0];
      const base64Data = await convertFileToBase64(file);
      const fileName = `PROFILE_${user.uid}_${Date.now()}.${file.name.split('.').pop()}`;

      const uploadRes = await new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          resolve({ success: false, error: "Layanan google.script.run tidak tersedia di lingkungan ini." });
          return;
        }

        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .uploadProfilePhotoToDrive(base64Data, fileName);
      });

      if (uploadRes && uploadRes.success) {
        finalPhotoURL = uploadRes.url;
      } else {
        throw new Error(uploadRes.error || "Gagal mengunggah foto ke Google Drive.");
      }
    }

    const userRef = doc(db, "users", user.uid);
    const profileData = {
      uid: user.uid,
      name: name,
      email: user.email,
      phone: phone,
      picCode: document.getElementById('setup_picCode')?.value || '',
      photoURL: finalPhotoURL,
      role: "Adjuster",
      createdAt: serverTimestamp()
    };

    await setDoc(userRef, profileData);
    window.currentUserProfile = profileData;

    Swal.fire({ icon: 'success', title: 'Profil Berhasil Disimpan!', timer: 1500, showConfirmButton: false });

    showSection('app-section');

    if (typeof window.updateHeaderProfileUI === 'function') {
      window.updateHeaderProfileUI();
    }

    if (typeof loadData === 'function') loadData();
    if (typeof loadJobDataFromSheet === 'function') loadJobDataFromSheet();

  } catch (error) {
    console.error("Gagal setup profil:", error);
    Swal.fire('Error', error.message || 'Terjadi kesalahan sistem', 'error');
  }
};

// =========================================================
// AUTH STATE ROUTER
// Mengamati status pergantian sesi autentikasi dan memuat dokumen Firestore
// =========================================================
onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      window.currentUserProfile = null;
      
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      const profileData = userSnap.exists() ? userSnap.data() : null;
      const isProfileComplete = profileData && profileData.name && profileData.phone && profileData.phone.trim() !== "";

      if (isProfileComplete) {
        window.currentUserProfile = profileData;
        showSection('app-section');

        if (typeof window.updateHeaderProfileUI === 'function') {
          window.updateHeaderProfileUI();
        }

        if (typeof loadData === 'function') loadData();
        if (typeof loadJobDataFromSheet === 'function') loadJobDataFromSheet();

      } else {
        showSection('setup-profile-section');

        const emailInput = document.getElementById('setup_email');
        const nameInput = document.getElementById('setup_name');
        if (emailInput) emailInput.value = user.email || '';
        if (nameInput && user.displayName) nameInput.value = user.displayName;
      }
    } catch (err) {
      console.error("Gagal mengecek profil di Firestore:", err);
      showSection('login-section');
      Swal.fire('Error Database', 'Gagal memuat profil: ' + err.message, 'error');
    }

  } else {
    showSection('login-section');
  }
});

// =========================================================
// SEND RESET PASSWORD
// Mengirimkan instruksi pemulihan kata sandi ke email terdaftar
// =========================================================
const sendResetPassword = document.getElementById("sendResetPassword");
if (sendResetPassword) {
  sendResetPassword.addEventListener("click", function (event) {
    event.preventDefault();
    const email = document.getElementById("email").value;
    if (!email) {
      Swal.fire('Email Kosong', 'Masukkan email Anda di kolom email terlebih dahulu!', 'warning');
      return;
    }
    sendPasswordResetEmail(auth, email);
    Swal.fire('Password Reset Terkirim', 'Silakan cek kotak masuk email Anda.', 'success');
    showSection('login-section');
  });
}
</script>
