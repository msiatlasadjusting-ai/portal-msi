<!-- FILE: scripts/Mastercase_Wizard_JS.html -->
<script>
// =========================================================
// MASTERCASE MULTI-STEP WIZARD CONTROLLER
// Logika navigasi bertahap form Create & Edit, validasi kelayakan stage (unlocked), dan sinkronisasi status
// =========================================================

var currentStageStep = 1;
var maxUnlockedCreateStage = 1;

var currentEditStageStep = 1;
var maxUnlockedEditStage = 1;

var STAGE_DEFAULT_STATUS = {
  1: 'On Process',
  2: 'In Site Survey',
  3: 'Drafting Report',
  4: 'Awaiting Invoice',
  5: 'Invoice Sent'
};

document.addEventListener("DOMContentLoaded", function () {
  setupStagePicSync();
  setupStatusSync();
});

// =========================================================
// SETUP STAGE PIC SYNC
// Menyelaraskan PIC penanggung jawab Stage 1 ke seluruh Stage handler berikutnya
// =========================================================
function setupStagePicSync() {
  ['create', 'edit'].forEach(function(prefix) {
    var leadPicEl = document.getElementById(prefix + '_pic');
    var stagePicIds = [
      prefix + '_stage2PicHandler',
      prefix + '_stage3PicHandler',
      prefix + '_stage4PicHandler',
      prefix + '_stage5PicHandler'
    ];

    if (leadPicEl) {
      leadPicEl.addEventListener('change', function() {
        var leadVal = this.value;
        stagePicIds.forEach(function(sId) {
          var sEl = document.getElementById(sId);
          if (sEl && sEl.dataset.userModified !== "true") {
            sEl.value = leadVal;
          }
        });
      });
    }

    stagePicIds.forEach(function(sId) {
      var sEl = document.getElementById(sId);
      if (sEl) {
        sEl.addEventListener('change', function() {
          this.dataset.userModified = "true";
        });
      }
    });
  });
}

// =========================================================
// SETUP STATUS SYNC
// Menandai modifikasi manual user pada input status agar tidak tertimpa otomatisasi
// =========================================================
function setupStatusSync() {
  ['create', 'edit'].forEach(function(prefix) {
    var statusEl = document.getElementById(prefix + '_status');
    if (statusEl) {
      statusEl.addEventListener('change', function() {
        this.dataset.userModified = "true";
      });
    }
  });
}

// =========================================================
// UPDATE DEFAULT STATUS BY STAGE
// Memperbarui status default form jika user belum mengubahnya secara eksplisit
// =========================================================
function updateDefaultStatusByStage(prefix, stageNum) {
  var statusEl = document.getElementById(prefix + '_status');
  if (statusEl && statusEl.dataset.userModified !== "true") {
    var targetStatus = STAGE_DEFAULT_STATUS[stageNum] || 'On Process';
    statusEl.value = targetStatus;
  }
}

// =========================================================
// CALCULATE MAX STAGE FROM FORM
// Mengevaluasi kelengkapan field untuk menentukan batas nomor stage yang dapat dibuka
// =========================================================
function calculateMaxStageFromForm(prefix) {
  var getElVal = function (fieldName) {
    var el = document.getElementById(prefix + '_' + fieldName);
    return el ? el.value : '';
  };

  var maxStage = 1;

  if (isValidValue(getElVal('instructionDate')) && isValidValue(getElVal('pic')) && isValidValue(getElVal('client'))) {
    maxStage = 2;
  } else return 1;

  if (isValidValue(getElVal('surveyStartDate')) || isValidValue(getElVal('surveyFinishDate'))) {
    maxStage = 3;
  } else return 2;

  if (isValidValue(getElVal('surveyReportSentOn'))) {
    maxStage = 4;
  } else return 3;

  var feeNum = parseMoneyValue(getElVal('feeIdr'));
  if (isValidValue(getElVal('lopApprovedDate')) || feeNum > 0) {
    maxStage = 5;
  } else return 4;

  return maxStage;
}

// =========================================================
// DETERMINE MAX UNLOCKED STAGE
// Menentukan stage terbuka maksimal berdasarkan data objek item yang sudah ada
// =========================================================
function determineMaxUnlockedStage(item) {
  if (!item) return 1;
  var maxStage = 1;

  if (isValidValue(item["Instruction Date"]) && isValidValue(item["Lead PIC"] || item["PIC"]) && isValidValue(item["Client"])) {
    maxStage = 2;
  } else return 1;

  if (isValidValue(item["Survey Start Date"] || item["surveyStartDate"] || item["Survey Date"]) || isValidValue(item["Survey Finish Date"] || item["surveyFinishDate"])) {
    maxStage = 3;
  } else return 2;

  if (isValidValue(item["Report Sent Date"] || item["Survey Report Sent on"])) {
    maxStage = 4;
  } else return 3;

  var fee = parseMoneyValue(item["Fee (IDR)"] || 0);
  if (isValidValue(item["LOP Approved Date"] || item["lopApprovedDate"]) || fee > 0) {
    maxStage = 5;
  } else return 4;

  return maxStage;
}

// =========================================================
// SWITCH CREATE STAGE
// Berpindah kartu tab stage form Tambah Mastercase
// =========================================================
function switchCreateStage(targetStage) {
  if (targetStage < 1 || targetStage > 5) return;

  var currentCalculatedMax = calculateMaxStageFromForm('create');
  maxUnlockedCreateStage = Math.max(maxUnlockedCreateStage, currentCalculatedMax);

  if (targetStage > maxUnlockedCreateStage) {
    Swal.fire({
      icon: 'warning',
      title: 'Stage Masih Terkunci',
      text: 'Lengkapi data Stage ' + (targetStage - 1) + ' terlebih dahulu!',
      confirmButtonColor: '#EC1F27'
    });
    return;
  }

  var oldCard = document.getElementById('stage_card_' + currentStageStep);
  if (oldCard) oldCard.classList.add('hidden');

  var newCard = document.getElementById('stage_card_' + targetStage);
  if (newCard) newCard.classList.remove('hidden');

  currentStageStep = targetStage;
  updateDefaultStatusByStage('create', targetStage);

  renderCreatePillHeader();
  updateCreateNavButtons();
}

// =========================================================
// NAVIGATE STAGE
// Tombol aksi Next / Prev pada stepper form Tambah Mastercase
// =========================================================
function navigateStage(direction) {
  if (direction === 1) {
    var currentCalculatedMax = calculateMaxStageFromForm('create');
    if ((currentStageStep + 1) > currentCalculatedMax) {
      Swal.fire({
        icon: 'warning',
        title: 'Stage Belum Selesai',
        text: 'Harap lengkapi data wajib di Stage ' + currentStageStep + ' sebelum lanjut!',
        confirmButtonColor: '#EC1F27'
      });
      return;
    }

    var nextStep = currentStageStep + 1;
    if (nextStep <= 5) {
      maxUnlockedCreateStage = Math.max(maxUnlockedCreateStage, nextStep);
      switchCreateStage(nextStep);
    }
  } else if (direction === -1) {
    var prevStep = currentStageStep - 1;
    if (prevStep >= 1) {
      switchCreateStage(prevStep);
    }
  }
}

// =========================================================
// RENDER CREATE PILL HEADER
// Merender styling tombol pill step wizard Create
// =========================================================
function renderCreatePillHeader() {
  for (var i = 1; i <= 5; i++) {
    var pill = document.getElementById('step_pill_' + i);
    if (!pill) continue;

    if (i === currentStageStep) {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-rose-50 border-2 border-[#EC1F27] text-[#EC1F27] shadow-sm transition-all text-left cursor-pointer";
      pill.style.opacity = "1";
    } else if (i <= maxUnlockedCreateStage) {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100 transition-all text-left cursor-pointer";
      pill.style.opacity = "1";
    } else {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-400 transition-all text-left cursor-not-allowed opacity-40";
    }
  }
}

// =========================================================
// UPDATE CREATE NAV BUTTONS
// Menampilkan atau menyembunyikan tombol Previous dan Next di form Tambah
// =========================================================
function updateCreateNavButtons() {
  var btnPrev = document.getElementById('btn_prev_stage');
  var btnNext = document.getElementById('btn_next_stage');

  if (currentStageStep > 1) {
    if (btnPrev) btnPrev.classList.remove('hidden');
  } else {
    if (btnPrev) btnPrev.classList.add('hidden');
  }

  if (currentStageStep < 5) {
    if (btnNext) {
      btnNext.innerHTML = 'Lanjut ke Stage ' + (currentStageStep + 1) + ' <i data-lucide="arrow-right" class="w-4 h-4"></i>';
      btnNext.classList.remove('hidden');
    }
  } else {
    if (btnNext) btnNext.classList.add('hidden');
  }

  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// =========================================================
// RESET CREATE WIZARD
// Mengembalikan posisi form Tambah Mastercase ke Stage 1
// =========================================================
function resetCreateWizard() {
  currentStageStep = 1;
  maxUnlockedCreateStage = 1;

  for (var i = 1; i <= 5; i++) {
    var card = document.getElementById('stage_card_' + i);
    if (card) {
      if (i === 1) card.classList.remove('hidden');
      else card.classList.add('hidden');
    }
  }

  renderCreatePillHeader();
  updateCreateNavButtons();
}

// =========================================================
// SWITCH EDIT STAGE
// Berpindah kartu tab stage form Edit Mastercase
// =========================================================
function switchEditStage(targetStage) {
  if (targetStage < 1 || targetStage > 5) return;

  var currentCalculatedMax = calculateMaxStageFromForm('edit');
  maxUnlockedEditStage = Math.max(maxUnlockedEditStage, currentCalculatedMax);

  if (targetStage > maxUnlockedEditStage) {
    Swal.fire({
      icon: 'warning',
      title: 'Stage Masih Terkunci',
      text: 'Lengkapi data Stage ' + (targetStage - 1) + ' terlebih dahulu!',
      confirmButtonColor: '#EC1F27'
    });
    return;
  }

  var oldCard = document.getElementById('edit_stage_card_' + currentEditStageStep);
  if (oldCard) oldCard.classList.add('hidden');

  var newCard = document.getElementById('edit_stage_card_' + targetStage);
  if (newCard) newCard.classList.remove('hidden');

  currentEditStageStep = targetStage;

  renderEditPillHeader();
  updateEditNavButtons();
}

// =========================================================
// NAVIGATE EDIT STAGE
// Tombol aksi Next / Prev pada stepper form Edit Mastercase
// =========================================================
function navigateEditStage(direction) {
  if (direction === 1) {
    var currentCalculatedMax = calculateMaxStageFromForm('edit');

    if ((currentEditStageStep + 1) > currentCalculatedMax) {
      Swal.fire({
        icon: 'warning',
        title: 'Stage Belum Selesai',
        text: 'Harap lengkapi data wajib di Stage ' + currentEditStageStep + ' sebelum lanjut!',
        confirmButtonColor: '#EC1F27'
      });
      return;
    }

    var nextStep = currentEditStageStep + 1;
    if (nextStep <= 5) {
      maxUnlockedEditStage = Math.max(maxUnlockedEditStage, nextStep);
      switchEditStage(nextStep);
    }
  } else if (direction === -1) {
    var prevStep = currentEditStageStep - 1;
    if (prevStep >= 1) {
      switchEditStage(prevStep);
    }
  }
}

// =========================================================
// RENDER EDIT PILL HEADER
// Merender styling tombol pill step wizard Edit
// =========================================================
function renderEditPillHeader() {
  for (var i = 1; i <= 5; i++) {
    var pill = document.getElementById('edit_step_pill_' + i);
    if (!pill) continue;

    if (i === currentEditStageStep) {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-rose-50 border-2 border-[#EC1F27] text-[#EC1F27] shadow-sm transition-all text-left cursor-pointer";
      pill.style.opacity = "1";
    } else if (i <= maxUnlockedEditStage) {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100 transition-all text-left cursor-pointer";
      pill.style.opacity = "1";
    } else {
      pill.className = "flex items-center gap-2 p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-400 transition-all text-left cursor-not-allowed opacity-40";
    }
  }
}

// =========================================================
// UPDATE EDIT NAV BUTTONS
// Menampilkan atau menyembunyikan tombol Previous dan Next di form Edit
// =========================================================
function updateEditNavButtons() {
  var btnPrev = document.getElementById('edit_btn_prev_stage');
  var btnNext = document.getElementById('edit_btn_next_stage');

  if (currentEditStageStep > 1) {
    if (btnPrev) btnPrev.classList.remove('hidden');
  } else {
    if (btnPrev) btnPrev.classList.add('hidden');
  }

  if (currentEditStageStep < 5) {
    if (btnNext) {
      btnNext.innerHTML = 'Lanjut ke Stage ' + (currentEditStageStep + 1) + ' <i data-lucide="arrow-right" class="w-4 h-4"></i>';
      btnNext.classList.remove('hidden');
    }
  } else {
    if (btnNext) btnNext.classList.add('hidden');
  }

  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// =========================================================
// RESET EDIT WIZARD
// Mengembalikan posisi form Edit Mastercase ke Stage 1 dengan kalkulasi batas stage terbuka
// =========================================================
function resetEditWizard(item) {
  currentEditStageStep = 1;
  maxUnlockedEditStage = determineMaxUnlockedStage(item);

  for (var i = 1; i <= 5; i++) {
    var card = document.getElementById('edit_stage_card_' + i);
    if (card) {
      if (i === 1) card.classList.remove('hidden');
      else card.classList.add('hidden');
    }
  }

  renderEditPillHeader();
  updateEditNavButtons();
}
</script>
